# 超现实抽象艺术动画风格配置
style_name: "超现实抽象艺术动画"
style_code: "surrealist_abstract_animation"
style_description: "结合了毕加索立体派与达利超现实主义的抽象动画风格，色彩夸张鲜艳，线条扭曲变形。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [熔岩红, 迷幻紫, 深邃蓝, 高饱和黄]
    辅助色: [霓虹绿, 深渊黑]
    氛围特征: "色彩极其夸张鲜艳，犹如熔岩翻滚、浓郁油彩剧烈旋转，高对比度带来极强视觉冲击力。"
  排版:
    元素布局: "错乱几何拼接，空间撕裂，打破常规物理边界的非对称分布。"
    层次关系: "梦幻多维交叠，前景与背景界限模糊，形体相互穿插重组。"
  构图:
    类型: "超现实扭曲与立体派解构"
    特征: "线条扭曲变形，透视关系错乱离奇，呈现达利式融化感与毕加索式碎块感。"
    视角: "极度夸张的透视扭曲，伴随视觉漩涡的动态视角。"
  特效:
    元素:
      - "流动扭曲的几何色块"
      - "色彩漩涡"
      - "宇宙星云级爆炸"
      - "视觉雷电"
      - "融化拉长的肌理"
    质感: "厚重油彩堆叠、熔岩般的流动感与异星失重感，具有强烈怪诞的超现实画作肌理。"
