# 极简风格配置
style_name: "极简风格"
style_code: "minimalist_style"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["莫兰迪色系", "高级灰", "纯色块"]
    辅助色: ["2-4种色彩控制"]
    氛围特征: "色调统一协调，简洁纯粹"
  排版:
    元素布局: "大量留白，注重负空间"
    层次关系: "简洁干净，去除不必要的装饰"
  构图:
    类型: "极简主义构图"
    特征: "留白艺术，空灵宁静"
    视角: "简约而富有美感"
  特效:
    元素:
      - "几何图形"
      - "流畅线条"
      - "柔和自然光影"
      - "抽象化符号"
    质感: "简洁现代，纯色块质感"
