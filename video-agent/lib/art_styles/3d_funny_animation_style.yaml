# 3D搞笑动画风格配置
style_name: "3D搞笑动画"
style_code: "3d_funny_animation_style"
style_description: "明快活泼的3D卡通动画风格，适合夸张搞笑的动物日常"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [明亮的橙色, 暖黄色, 纯白色]
    辅助色: [薄荷绿, 金属银, 木色]
    氛围特征: "明快、活泼、充满活力，高饱和度"
  排版:
    元素布局: "紧凑且聚焦主角，背景元素丰富不杂乱"
    层次关系: "主角居中凸显，背景适当虚化强调动作与表情"
  构图:
    类型: "中心构图与特写"
    特征: "突出夸张的肢体动作与面部表情"
    视角: "平视与微仰视结合增强戏剧感"
  特效:
    元素:
      - "夸张的面粉爆炸粒子"
      - "飞舞的烟尘"
      - "动态模糊效果"
    质感: "蓬松柔软的毛发、光滑的厨房表面、细腻粉状质感"
