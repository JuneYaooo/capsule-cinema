# 浪浪山风格配置
style_name: "浪浪山"
style_code: "langlangshan_style"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["灰绿", "赭石", "土黄等大地色系"]
    辅助色: ["灰调为主"]
    氛围特征: "色彩饱和度偏低，质朴沉稳，略带沧桑"
  排版:
    元素布局: "场景开阔，有留白"
    层次关系: "意境悠远，借鉴传统山水画"
  构图:
    类型: "中国传统山水画构图"
    特征: "人物造型简单质朴，富有表现力，强调故事感"
    视角: "开阔视角，意境悠远"
  特效:
    元素:
      - "手绘感强的线条"
      - "粗粝感和顿挫变化"
      - "水墨画意境"
      - "古典美术片质感"
    质感: "中国古典美术片与水墨画结合"