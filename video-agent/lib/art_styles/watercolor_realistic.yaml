# 水彩画写实风格配置
style_name: "水彩画写实"
style_code: "watercolor_realistic"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["透明水彩叠加色", "色彩丰富饱满"]
    辅助色: ["冷暖对比色"]
    氛围特征: "透明质感，色彩层叠丰富，光影效果突出"
  排版:
    元素布局: "透视准确，空间层次丰富"
    层次关系: "色彩氛围感强烈，前景-中景-背景层次清晰"
  构图:
    类型: "水彩写实构图"
    特征: "形体准确生动，细节精致"
    视角: "透视准确的写实视角"
  特效:
    元素:
      - "精细素描线条"
      - "水彩渲染效果"
      - "色彩边缘自然晕染"
      - "透明叠加质感"
    质感: "水彩特有的透明感和流动性" 