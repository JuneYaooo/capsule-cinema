# 国风产品设计风格配置
style_name: "国风产品设计"
style_code: "chinese_product_design"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["深蓝", "墨绿", "朱红等单一主色调"]
    辅助色: ["层次丰富自然"]
    氛围特征: "景泰蓝般的光泽与高级质感"
  排版:
    元素布局: "产品效果图和平面展开印刷图，标注尺寸"
    层次关系: "画面干净精致，细节完美"
  构图:
    类型: "产品设计专业构图"
    特征: "融合现代设计与传统东方美学"
    视角: "产品展示视角"
  特效:
    元素:
      - "抽象颜料笔触"
      - "东方元素（花卉、植物、云纹、山水）"
      - "油画肌理和手绘质感"
      - "材质细节和光泽反射"
    质感: "超清产品渲染，专业级产品摄影效果"
