# 暖调水墨古典中国风风格配置
style_name: "暖调水墨古典中国风"
style_code: "classical_ink_warm_style"
style_description: "结合传统中国风水墨意境与现代高保真暖调光影质感的美学风格"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [暖黄色, 枸杞红, 水墨黑]
    辅助色: [金黄, 木褐]
    氛围特征: "宁静古典，温暖治愈，富有浓郁的东方药理文化积淀感与温柔光晕"
  排版:
    元素布局: "讲究东方意境的留白，主体聚中呈现"
    层次关系: "前实后虚，焦外呈现水墨晕染化开的柔和层次"
  构图:
    类型: "东方对称与微距留白构图"
    特征: "动静结合，焦点明确，注重光影对比"
    视角: "平视结合细节微距"
  特效:
    元素:
      - "丁达尔光束"
      - "水墨晕染边缘转场"
      - "水雾氤氲"
    质感: "画面伴随暖色光斑折射，保留宣纸轻微纹理与水墨流动相通的清透质感"
