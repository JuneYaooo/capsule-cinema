name: capsule-consistency

on:
  push:
    branches: [main]
    paths:
      - "capsules/**"
      - "scripts/capsule_*.py"
      - ".github/workflows/capsule-lint.yml"
  pull_request:
    paths:
      - "capsules/**"
      - "scripts/capsule_*.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3.12 -m pip install --quiet pyyaml
      - name: Validate and consistency-lint every tracked capsule
        run: |
          set -euo pipefail
          failed=0
          for dir in capsules/*.capsule; do
            echo "== $dir =="
            python3.12 scripts/capsule_package_validate.py "$dir" --warnings-ok || failed=1
          done
          exit $failed
