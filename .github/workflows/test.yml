name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r lib/requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Run tests
        env:
          PYTHON_BIN: python
          PYTHONPATH: lib
        run: npm test
