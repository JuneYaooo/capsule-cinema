<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 产品工作台</title>
  <desc id="desc">style:product-workbench。马卡龙浅色系的产品工作台：创作工作台 assetShelf、timelineConsole、deliveryPanel 和 learningRail 围绕视频配方协同工作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.43" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="capsule" x1="394" y1="138" x2="888" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEDD5"/>
      <stop offset="0.32" stop-color="#CCFBF1"/>
      <stop offset="0.68" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="glass" x1="430" y1="178" x2="850" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="rail" x1="370" y1="478" x2="898" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCE7F3"/>
      <stop offset="0.28" stop-color="#FFEDD5"/>
      <stop offset="0.58" stop-color="#CCFBF1"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(642 318) rotate(90) scale(230 390)">
      <stop stop-color="#CCFBF1" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#E0F2FE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-18%" y="-24%" width="136%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-28%" width="140%" height="156%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .subtitle{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#35445D}
      .label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .body{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5B6B84}
      .tiny{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#607089}
      .code{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#00796F}
      .micro{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8291A8}
      .eyebrow{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#00877E}
      .stroke{stroke:#B9C6D6;stroke-width:2;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1280" height="560" rx="30" fill="url(#bg)"/>
  <rect x="34" y="30" width="1212" height="500" rx="30" fill="#FFFFFF" fill-opacity="0.48" stroke="#D7DEE8"/>
  <circle cx="638" cy="318" r="250" fill="url(#halo)"/>
  <path d="M74 486C260 442 382 438 544 472C699 504 816 498 954 454C1056 421 1144 420 1207 446" stroke="#FFFFFF" stroke-width="44" stroke-opacity="0.42" stroke-linecap="round"/>

  <text x="72" y="82" class="eyebrow">CAPSULE CINEMA</text>
  <text x="72" y="126" class="title">把跑通的视频，变成下一次能复用的视频配方</text>
  <text x="72" y="158" class="subtitle">从一句需求开始，经过分镜、生成、质检和返工，把稳定方法沉淀下来。</text>

  <g id="assetShelf" filter="url(#shadow)">
    <rect x="72" y="206" width="258" height="244" rx="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#D7DEE8"/>
    <text x="102" y="242" class="label">创作工作台</text>
    <text x="102" y="266" class="body">需求、素材、工具、风格先入库</text>
    <rect x="102" y="294" width="92" height="42" rx="18" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="124" y="320" class="tiny">需求</text>
    <path d="M172 305h11M172 315h11M172 325h11" class="stroke" stroke-width="1.6"/>
    <rect x="208" y="294" width="92" height="42" rx="18" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="230" y="320" class="tiny">素材</text>
    <circle cx="278" cy="315" r="10" fill="#FFFFFF" stroke="#5EEAD4"/>
    <rect x="102" y="350" width="92" height="42" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="124" y="376" class="tiny">工具</text>
    <path d="M174 362l10 10-10 10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="350" width="92" height="42" rx="18" fill="#FCE7F3" stroke="#F9A8D4"/>
    <text x="230" y="376" class="tiny">风格</text>
    <path d="M272 362c10 4 10 16 0 20c-10-4-10-16 0-20z" fill="#FFFFFF" stroke="#F9A8D4"/>
    <rect x="102" y="410" width="198" height="18" rx="9" fill="#ECFEFF" stroke="#67E8F9"/>
    <circle cx="118" cy="419" r="4" fill="#5EEAD4"/>
    <text x="132" y="423" class="micro">参考视频 / BGM / 文案</text>
  </g>

  <path d="M330 320C376 318 382 278 422 276" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M330 384C380 386 388 428 430 428" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>
  <circle cx="374" cy="319" r="5" fill="#5EEAD4"/>
  <circle cx="390" cy="408" r="5" fill="#F9A8D4"/>

  <g id="timelineConsole" filter="url(#shadow)">
    <rect x="398" y="172" width="494" height="294" rx="44" fill="url(#capsule)"/>
    <rect x="430" y="204" width="430" height="230" rx="32" fill="url(#glass)" stroke="#FFFFFF"/>
    <rect x="462" y="232" width="78" height="46" rx="16" fill="#FFF7ED" stroke="#FED7AA"/>
    <rect x="554" y="232" width="78" height="46" rx="16" fill="#ECFEFF" stroke="#67E8F9"/>
    <rect x="646" y="232" width="78" height="46" rx="16" fill="#FDF2F8" stroke="#F9A8D4"/>
    <text x="486" y="264" class="micro">PLAN</text>
    <text x="578" y="264" class="micro">MAKE</text>
    <text x="670" y="264" class="micro">QA</text>
    <text x="486" y="322" class="title">视频配方</text>
    <text x="486" y="354" class="subtitle">结构 + 风格 + 工具 + 质量门</text>
    <text x="486" y="386" class="code">capsules/&lt;name&gt;.capsule</text>
    <rect x="486" y="408" width="314" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="486" y="408" width="86" height="10" rx="5" fill="#FCE7F3"/>
    <rect x="600" y="408" width="86" height="10" rx="5" fill="#E0F2FE"/>
    <rect x="714" y="408" width="86" height="10" rx="5" fill="#CCFBF1"/>
    <circle cx="572" cy="413" r="6" fill="#F9A8D4"/>
    <circle cx="686" cy="413" r="6" fill="#7DD3FC"/>
    <circle cx="800" cy="413" r="6" fill="#5EEAD4"/>
  </g>

  <path d="M892 310C930 306 936 276 984 274" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M892 410C938 410 944 444 986 444" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>

  <g id="deliveryPanel" filter="url(#shadow)">
    <rect x="984" y="184" width="224" height="276" rx="28" fill="#FFFFFF" fill-opacity="0.93" stroke="#CBD5E1"/>
    <text x="1018" y="224" class="label">交付轨道</text>
    <text x="1018" y="248" class="body">分镜、素材、成片、QA 成组交付</text>
    <rect x="1018" y="274" width="154" height="38" rx="14" fill="#CCFBF1"/>
    <text x="1042" y="298" class="tiny">分镜方案</text>
    <rect x="1018" y="324" width="154" height="38" rx="14" fill="#E0F2FE"/>
    <text x="1042" y="348" class="tiny">生成素材</text>
    <rect x="1018" y="374" width="154" height="38" rx="14" fill="#FFEDD5"/>
    <text x="1042" y="398" class="tiny">拼接成片</text>
    <rect x="1140" y="274" width="32" height="138" rx="10" fill="#FFFFFF" fill-opacity="0.58"/>
    <path d="M1150 296l6 6 10-14M1150 346l6 6 10-14M1150 396l6 6 10-14" stroke="#14B8A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="learningRail" filter="url(#softShadow)">
    <rect x="386" y="478" width="508" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.86" stroke="#CBD5E1"/>
    <rect x="412" y="490" width="280" height="12" rx="6" fill="url(#rail)"/>
    <text x="718" y="502" class="tiny">把有效经验回写到视频配方</text>
  </g>
</svg>
