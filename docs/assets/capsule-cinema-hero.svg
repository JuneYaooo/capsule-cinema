<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema video recipe workflow</title>
  <desc id="desc">A workflow diagram showing brief, materials and custom tools going into a video recipe capsule, then producing storyboard, media generation, QA, release and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="0.45" stop-color="#17324A"/>
      <stop offset="1" stop-color="#221B2F"/>
    </linearGradient>
    <linearGradient id="capsule" x1="455" y1="140" x2="830" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12B981"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #D8F3FF; }
      .line { stroke: #E2E8F0; stroke-opacity: 0.42; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect x="34" y="32" width="1212" height="496" rx="24" fill="#0F172A" fill-opacity="0.34" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <text x="72" y="78" class="tiny">CAPSULE CINEMA</text>
  <text x="72" y="116" class="label">把一次跑通的视频，沉淀成可以复用的视频配方</text>
  <text x="72" y="146" class="small">从需求、素材、工具，到分镜、生成、质检、发布和经验回写</text>

  <g filter="url(#shadow)">
    <rect x="72" y="205" width="235" height="72" rx="16" fill="#0F172A" fill-opacity="0.74" stroke="#E2E8F0" stroke-opacity="0.16"/>
    <text x="96" y="236" class="small">需求 Brief</text>
    <text x="96" y="260" class="tiny">主题 / 人群 / 平台 / 风格</text>

    <rect x="72" y="306" width="235" height="72" rx="16" fill="#0F172A" fill-opacity="0.74" stroke="#E2E8F0" stroke-opacity="0.16"/>
    <text x="96" y="337" class="small">素材 Materials</text>
    <text x="96" y="361" class="tiny">图片 / 视频 / 文案 / 参考片</text>

    <rect x="72" y="407" width="235" height="72" rx="16" fill="#0F172A" fill-opacity="0.74" stroke="#E2E8F0" stroke-opacity="0.16"/>
    <text x="96" y="438" class="small">自定义工具 Tools</text>
    <text x="96" y="462" class="tiny">图像 / 视频 / TTS / BGM / QA</text>
  </g>

  <path d="M315 241 C380 241 400 241 450 241" class="line"/>
  <path d="M315 342 C380 342 400 342 450 342" class="line"/>
  <path d="M315 443 C380 443 400 443 450 443" class="line"/>

  <g filter="url(#shadow)">
    <rect x="442" y="180" width="396" height="240" rx="120" fill="url(#capsule)"/>
    <rect x="466" y="204" width="348" height="192" rx="96" fill="#020617" fill-opacity="0.52" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <text x="540" y="266" class="label">Video Recipe</text>
    <text x="542" y="300" class="small">视频配方 / Capsule</text>
    <text x="536" y="335" class="mono">structure + style + tools</text>
    <text x="532" y="361" class="mono">quality gates + learning</text>
  </g>

  <path d="M842 300 C890 300 908 300 942 300" class="line"/>

  <g filter="url(#shadow)">
    <rect x="952" y="178" width="252" height="308" rx="20" fill="#0F172A" fill-opacity="0.74" stroke="#E2E8F0" stroke-opacity="0.16"/>
    <text x="982" y="218" class="small">Production Flow</text>

    <rect x="982" y="248" width="190" height="38" rx="10" fill="#0F766E" opacity="0.82"/>
    <text x="1002" y="273" class="tiny" fill="#ECFEFF">01 分镜 Storyboard</text>

    <rect x="982" y="300" width="190" height="38" rx="10" fill="#2563EB" opacity="0.82"/>
    <text x="1002" y="325" class="tiny" fill="#EFF6FF">02 生成 Media</text>

    <rect x="982" y="352" width="190" height="38" rx="10" fill="#B45309" opacity="0.86"/>
    <text x="1002" y="377" class="tiny" fill="#FFFBEB">03 拼接 Compose</text>

    <rect x="982" y="404" width="190" height="38" rx="10" fill="#BE123C" opacity="0.82"/>
    <text x="1002" y="429" class="tiny" fill="#FFF1F2">04 质检 QA</text>
  </g>

  <path d="M1078 486 C1078 516 795 516 704 428" class="line" stroke-dasharray="8 8"/>
  <text x="797" y="512" class="tiny">把有效经验回写到配方</text>

  <g opacity="0.9">
    <rect x="448" y="454" width="118" height="34" rx="17" fill="#14B8A6" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.28"/>
    <text x="471" y="476" class="tiny">可复用</text>
    <rect x="584" y="454" width="118" height="34" rx="17" fill="#38BDF8" fill-opacity="0.16" stroke="#7DD3FC" stroke-opacity="0.28"/>
    <text x="607" y="476" class="tiny">可替换</text>
    <rect x="720" y="454" width="118" height="34" rx="17" fill="#F97316" fill-opacity="0.16" stroke="#FB923C" stroke-opacity="0.28"/>
    <text x="743" y="476" class="tiny">可质检</text>
  </g>
</svg>
