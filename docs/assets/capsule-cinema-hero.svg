<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 创作工作台</title>
  <desc id="desc">style:studio-workbench。马卡龙浅色系的创作工作台：需求、素材和工具进入视频配方，产出分镜、成片、质检报告和可复用经验。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.48" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="capsuleBody" x1="390" y1="126" x2="900" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset="0.34" stop-color="#A7F3D0"/>
      <stop offset="0.7" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="glass" x1="424" y1="164" x2="862" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <style>
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F766E; }
      .title { font: 750 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .code { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0F766E; }
      .line { stroke: #64748B; stroke-opacity: 0.34; stroke-width: 2.5; stroke-linecap: round; }
      .dash { stroke: #64748B; stroke-opacity: 0.32; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 9; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="30" fill="url(#background)"/>
  <rect x="34" y="32" width="1212" height="496" rx="28" fill="#FFFFFF" fill-opacity="0.54" stroke="#CBD5E1" stroke-opacity="0.72"/>

  <text x="72" y="82" class="eyebrow">CAPSULE CINEMA</text>
  <text x="72" y="126" class="title">把跑通的视频，变成下一次能复用的视频配方</text>
  <text x="72" y="158" class="body">从一句需求开始，经过分镜、生成、质检和返工，把稳定方法沉淀下来。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="206" width="252" height="244" rx="24" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="100" y="244" class="label">输入工作台</text>
    <rect x="100" y="266" width="92" height="34" rx="17" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="125" y="288" class="tiny">需求</text>
    <rect x="204" y="266" width="92" height="34" rx="17" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="229" y="288" class="tiny">素材</text>
    <rect x="100" y="314" width="92" height="34" rx="17" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="125" y="336" class="tiny">工具</text>
    <rect x="204" y="314" width="92" height="34" rx="17" fill="#FCE7F3" stroke="#F9A8D4"/>
    <text x="229" y="336" class="tiny">风格</text>
    <rect x="100" y="372" width="196" height="38" rx="19" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="128" y="396" class="label">参考视频 / BGM / 文案</text>
    <rect x="100" y="424" width="196" height="10" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  </g>

  <path d="M328 328 C358 328 376 308 402 286" class="line"/>
  <path d="M328 390 C366 390 386 388 418 384" class="line"/>

  <g filter="url(#shadow)">
    <rect x="400" y="174" width="492" height="292" rx="38" fill="url(#capsuleBody)"/>
    <rect x="430" y="204" width="432" height="232" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="486" y="260" class="title">视频配方</text>
    <text x="486" y="296" class="body">结构 + 风格 + 工具 + 质量门</text>
    <text x="486" y="332" class="code">capsules/&lt;name&gt;.capsule</text>

    <rect x="486" y="358" width="94" height="30" rx="15" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="510" y="378" class="tiny">可复用</text>
    <rect x="596" y="358" width="94" height="30" rx="15" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="620" y="378" class="tiny">可替换</text>
    <rect x="706" y="358" width="94" height="30" rx="15" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="730" y="378" class="tiny">可质检</text>

    <rect x="486" y="404" width="314" height="10" rx="5" fill="#FCE7F3"/>
    <circle cx="520" cy="409" r="5" fill="#F9A8D4"/>
    <circle cx="642" cy="409" r="5" fill="#7DD3FC"/>
    <circle cx="764" cy="409" r="5" fill="#5EEAD4"/>
  </g>

  <path d="M894 318 C924 318 944 302 976 290" class="line"/>

  <g filter="url(#shadow)">
    <rect x="984" y="184" width="224" height="276" rx="26" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1018" y="224" class="label">交付轨道</text>
    <rect x="1018" y="250" width="152" height="34" rx="11" fill="#CCFBF1"/>
    <text x="1042" y="272" class="tiny">分镜方案</text>
    <rect x="1018" y="296" width="152" height="34" rx="11" fill="#E0F2FE"/>
    <text x="1042" y="318" class="tiny">生成素材</text>
    <rect x="1018" y="342" width="152" height="34" rx="11" fill="#FFEDD5"/>
    <text x="1042" y="364" class="tiny">拼接成片</text>
    <rect x="1018" y="388" width="152" height="34" rx="11" fill="#FCE7F3"/>
    <text x="1042" y="410" class="tiny">QA 和发布</text>
  </g>

  <path d="M1096 462 C1026 516 660 526 518 466" class="dash"/>
  <rect x="430" y="474" width="420" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.76" stroke="#CBD5E1"/>
  <text x="512" y="496" class="tiny">把有效经验回写到视频配方</text>
</svg>
