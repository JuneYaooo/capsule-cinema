<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema workflow</title>
  <desc id="desc">A loop from brief, storyboard, tool routing, media generation, QA, and recipe learning.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #64748b; }
      .step { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #111827; }
      .body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #475569; }
      .code { font: 700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #0f766e; }
      .card { fill: #ffffff; stroke: #dce7e3; stroke-width: 1.2; }
      .line { stroke: #0f766e; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1400" height="520" rx="32" fill="#f8fafc"/>
  <text x="64" y="78" class="title">From brief to reusable recipe</text>
  <text x="64" y="114" class="subtitle">Review the plan, route the tools, then save what worked back into a Capsule.</text>

  <g transform="translate(64 176)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="180" height="180" rx="20"/>
    <circle cx="42" cy="44" r="18" fill="#ccfbf1"/>
    <text x="42" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#0f766e">1</text>
    <text x="24" y="94" class="step">Brief</text>
    <text x="24" y="128" class="body">Topic, audience</text>
    <text x="24" y="154" class="body">assets, style</text>

    <rect class="card" x="218" y="0" width="180" height="180" rx="20"/>
    <circle cx="260" cy="44" r="18" fill="#dbeafe"/>
    <text x="260" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#1d4ed8">2</text>
    <text x="242" y="94" class="step">Storyboard</text>
    <text x="242" y="128" class="body">Structure</text>
    <text x="242" y="154" class="code">storyboard.json</text>

    <rect class="card" x="436" y="0" width="180" height="180" rx="20"/>
    <circle cx="478" cy="44" r="18" fill="#fef3c7"/>
    <text x="478" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#b45309">3</text>
    <text x="460" y="94" class="step">Route</text>
    <text x="460" y="128" class="body">Image, video</text>
    <text x="460" y="154" class="body">TTS, BGM</text>

    <rect class="card" x="654" y="0" width="180" height="180" rx="20"/>
    <circle cx="696" cy="44" r="18" fill="#fae8ff"/>
    <text x="696" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#a21caf">4</text>
    <text x="678" y="94" class="step">Generate</text>
    <text x="678" y="128" class="body">Shots, voice</text>
    <text x="678" y="154" class="body">captions, edit</text>

    <rect class="card" x="872" y="0" width="180" height="180" rx="20"/>
    <circle cx="914" cy="44" r="18" fill="#fee2e2"/>
    <text x="914" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#b91c1c">5</text>
    <text x="896" y="94" class="step">Local QA</text>
    <text x="896" y="128" class="body">Aspect, audio</text>
    <text x="896" y="154" class="body">captions, gates</text>

    <rect class="card" x="1090" y="0" width="180" height="180" rx="20"/>
    <circle cx="1132" cy="44" r="18" fill="#ecfccb"/>
    <text x="1132" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#4d7c0f">6</text>
    <text x="1114" y="94" class="step">Learn</text>
    <text x="1114" y="128" class="body">Stable parts</text>
    <text x="1114" y="154" class="body">promoted back</text>
  </g>

  <g>
    <path class="line" d="M254 266 H294"/>
    <path class="line" d="M472 266 H512"/>
    <path class="line" d="M690 266 H730"/>
    <path class="line" d="M908 266 H948"/>
    <path class="line" d="M1126 266 H1166"/>
    <path d="M288 254 L306 266 L288 278 Z" fill="#0f766e"/>
    <path d="M506 254 L524 266 L506 278 Z" fill="#0f766e"/>
    <path d="M724 254 L742 266 L724 278 Z" fill="#0f766e"/>
    <path d="M942 254 L960 266 L942 278 Z" fill="#0f766e"/>
    <path d="M1160 254 L1178 266 L1160 278 Z" fill="#0f766e"/>
  </g>

  <path d="M1174 390 C870 470 520 470 216 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="552" y="486" class="subtitle">A good result becomes the next starting point</text>
</svg>
