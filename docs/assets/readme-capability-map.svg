 fill="#657B94">虚拟主播</text></g><g transform="translate(398 410)"><rect width="282" height="90" rx="16" fill="#09111E" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="0" y="0" width="5" height="90" rx="2.5" fill="#B6E46B"/><text x="20" y="29" class="label" fill="#F3F7FC">动作模仿</text><text x="20" y="54" class="body" fill="#91A5BC">单人 · 多人动作迁移</text><text x="20" y="75" class="small" fill="#657B94">跳舞与节拍</text></g><g transform="translate(708 410)"><rect width="282" height="90" rx="16" fill="#09111E" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="0" y="0" width="5" height="90" rx="2.5" fill="#65F3DE"/><text x="20" y="29" class="label" fill="#F3F7FC">剪辑与字幕</text><text x="20" y="54" class="body" fill="#91A5BC">拼接 · 转码 · 字幕</text><text x="20" y="75" class="small" fill="#657B94">封面与发布文件</text></g><g transform="translate(1018 410)"><rect width="282" height="90" rx="16" fill="#09111E" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="0" y="0" width="5" height="90" rx="2.5" fill="#7C8CFF"/><text x="20" y="29" class="label" fill="#F3F7FC">质量与发布</text><text x="20" y="54" class="body" fill="#91A5BC">画幅 · 响度 · 黑屏</text><text x="20" y="75" class="small" fill="#657B94">修复与发布检查</text></g></g>
  <g transform="translate(160 572)" class="sans" filter="url(#shadow)">
    <rect width="1080" height="104" rx="28" fill="#111C2D" stroke="#65F3DE" stroke-opacity=".25"/>
    <text x="34" y="43" class="small mono" fill="#65F3DE">02 · 有效路由器</text>
    <text x="34" y="72" class="section" fill="#F3F7FC">能力标签 + 硬限制 + 凭证状态 + 渠道政策</text><rect x="660" y="30" width="72" height="44" rx="13" fill="#7C8CFF" fill-opacity=".1" stroke="#7C8CFF" stroke-opacity=".22"/><text x="696" y="57" text-anchor="middle" class="small mono" fill="#B9C1FF">过滤</text><path d="M733 52H748" stroke="#51647B" stroke-width="2" stroke-linecap="round"/><path d="M739 45L748 52L739 59" stroke="#51647B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="752" y="30" width="72" height="44" rx="13" fill="#7C8CFF" fill-opacity=".1" stroke="#7C8CFF" stroke-opacity=".22"/><text x="788" y="57" text-anchor="middle" class="small mono" fill="#B9C1FF">匹配</text><path d="M825 52H840" stroke="#51647B" stroke-width="2" stroke-linecap="round"/><path d="M831 45L840 52L831 59" stroke="#51647B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="844" y="30" width="72" height="44" rx="13" fill="#7C8CFF" fill-opacity=".1" stroke="#7C8CFF" stroke-opacity=".22"/><text x="880" y="57" text-anchor="middle" class="small mono" fill="#B9C1FF">策略</text><path d="M917 52H932" stroke="#51647B" stroke-width="2" stroke-linecap="round"/><path d="M923 45L932 52L923 59" stroke="#51647B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="936" y="30" width="72" height="44" rx="13" fill="#65F3DE" fill-opacity=".14" stroke="#65F3DE" stroke-opacity=".22"/><text x="972" y="57" text-anchor="middle" class="small mono" fill="#9EF4E8">路线</text></g>
  <g class="sans"><text x="72" y="735" class="section" fill="#F1F6FC">03 · 可覆盖的视频路线</text><text x="72" y="761" class="small mono" fill="#7288A2">同一能力可以组合进不同交付承诺</text><g transform="translate(72 788)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#65F3DE"/><text x="42" y="27" class="label" fill="#F2F6FC">真实素材剪辑</text><text x="42" y="47" class="small mono" fill="#6F859E">source_led</text></g><g transform="translate(388 788)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#7C8CFF"/><text x="42" y="27" class="label" fill="#F2F6FC">通用 AI 视频</text><text x="42" y="47" class="small mono" fill="#6F859E">motion_led</text></g><g transform="translate(704 788)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#65F3DE"/><text x="42" y="27" class="label" fill="#F2F6FC">电商带货</text><text x="42" y="47" class="small mono" fill="#6F859E">commerce</text></g><g transform="translate(1020 788)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#7C8CFF"/><text x="42" y="27" class="label" fill="#F2F6FC">AI 音乐 MV</text><text x="42" y="47" class="small mono" fill="#6F859E">music_video</text></g><g transform="translate(230 870)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#65F3DE"/><text x="42" y="27" class="label" fill="#F2F6FC">数字人口播</text><text x="42" y="47" class="small mono" fill="#6F859E">digital_human</text></g><g transform="translate(546 870)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#7C8CFF"/><text x="42" y="27" class="label" fill="#F2F6FC">动作模仿</text><text x="42" y="47" class="small mono" fill="#6F859E">action_transfer</text></g><g transform="translate(862 870)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#65F3DE"/><text x="42" y="27" class="label" fill="#F2F6FC">参考视频配方草稿</text><text x="42" y="47" class="small mono" fill="#6F859E">reference_remake</text></g></g></svg>
