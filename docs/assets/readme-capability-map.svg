<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 视频能力地图</title>
  <desc id="desc">展示 Capsule Cinema 的底层视频工具能力和可覆盖的视频生产场景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="52%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#e5edf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f7ff"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .section { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .chip { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1e3a8a; }
      .card { fill: url(#panel); stroke: #b8cce0; stroke-width: 1.4; }
      .route { fill: #f8fafc; stroke: #c4d4e7; stroke-width: 1.2; }
      .line { stroke: #2563eb; stroke-width: 3; stroke-linecap: round; opacity: 0.8; }
      .thin { stroke: #93c5fd; stroke-width: 1.2; opacity: 0.85; }
    </style>
  </defs>

  <rect width="1400" height="980" rx="34" fill="url(#bg)"/>
  <path d="M70 142 H1330" class="thin"/>
  <circle cx="178" cy="142" r="4" fill="#2563eb"/>
  <circle cx="1222" cy="142" r="4" fill="#2563eb"/>

  <text x="70" y="82" class="title">视频能力地图</text>
  <text x="70" y="120" class="subtitle">从真实素材到 AI 生成，从声音到动作与数字人，按能力标签编排成可复用视频配方</text>

  <g filter="url(#shadow)">
    <rect x="60" y="172" width="1280" height="386" rx="28" fill="#f8fbff" stroke="#c9d8ea" stroke-width="1.4"/>
    <text x="92" y="220" class="section">01 底层能力层</text>
    <text x="92" y="250" class="small">配方声明需要什么能力，工具用标签声明能提供什么能力，运行时负责匹配和替代路线。</text>

    <g transform="translate(92 286)">
      <rect class="card" x="0" y="0" width="284" height="108" rx="18"/>
      <text x="24" y="36" class="label">素材与参考解析</text>
      <text x="24" y="66" class="body">本地视频分析、镜头节奏</text>
      <text x="24" y="90" class="body">文案结构、风格与音频策略</text>

      <rect class="card" x="316" y="0" width="284" height="108" rx="18"/>
      <text x="340" y="36" class="label">图像生成</text>
      <text x="340" y="66" class="body">文生图、图生图、角色参考</text>
      <text x="340" y="90" class="body">商品图、封面图、场景图</text>

      <rect class="card" x="632" y="0" width="284" height="108" rx="18"/>
      <text x="656" y="36" class="label">AI 视频生成</text>
      <text x="656" y="66" class="body">文生视频、图生视频</text>
      <text x="656" y="90" class="body">首尾帧、通用镜头、原生音频</text>

      <rect class="card" x="948" y="0" width="284" height="108" rx="18"/>
      <text x="972" y="36" class="label">语音与音乐</text>
      <text x="972" y="66" class="body">TTS、音色、BGM、音效</text>
      <text x="972" y="90" class="body">AI 音乐、纯音乐、人声音乐</text>

      <rect class="card" x="0" y="132" width="284" height="108" rx="18"/>
      <text x="24" y="168" class="label">数字人与对口型</text>
      <text x="24" y="198" class="body">图片+音频对口型</text>
      <text x="24" y="222" class="body">视频换音轨、数字人口播</text>

      <rect class="card" x="316" y="132" width="284" height="108" rx="18"/>
      <text x="340" y="168" class="label">动作模仿</text>
      <text x="340" y="198" class="body">单人动作迁移、多人动作迁移</text>
      <text x="340" y="222" class="body">跳舞、动作参考、分段生成</text>

      <rect class="card" x="632" y="132" width="284" height="108" rx="18"/>
      <text x="656" y="168" class="label">剪辑与字幕</text>
      <text x="656" y="198" class="body">拼接、字幕、转码、封面</text>
      <text x="656" y="222" class="body">片头片尾、时间线校验</text>

      <rect class="card" x="948" y="132" width="284" height="108" rx="18"/>
      <text x="972" y="168" class="label">质量与发布</text>
      <text x="972" y="198" class="body">黑屏、画幅、字幕遮挡</text>
      <text x="972" y="222" class="body">响度、语言匹配、发布检查点</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="594" width="1280" height="316" rx="28" fill="#f8fbff" stroke="#c9d8ea" stroke-width="1.4"/>
    <text x="92" y="642" class="section">02 可覆盖的视频路线</text>
    <text x="92" y="672" class="small">不是只做一种“文生视频”，而是把不同能力组合成面向场景的生产链路。</text>

    <g transform="translate(92 704)">
      <rect class="route" x="0" y="0" width="246" height="78" rx="16"/>
      <text x="20" y="32" class="label">真实素材剪辑生成</text>
      <text x="20" y="58" class="body">素材分析、剪辑、字幕、QA</text>

      <rect class="route" x="268" y="0" width="246" height="78" rx="16"/>
      <text x="288" y="32" class="label">通用 AI 视频创作</text>
      <text x="288" y="58" class="body">分镜、图片、视频、配音</text>

      <rect class="route" x="536" y="0" width="246" height="78" rx="16"/>
      <text x="556" y="32" class="label">电商带货视频</text>
      <text x="556" y="58" class="body">商品图、卖点、场景展示</text>

      <rect class="route" x="804" y="0" width="246" height="78" rx="16"/>
      <text x="824" y="32" class="label">AI 音乐 MV</text>
      <text x="824" y="58" class="body">节奏驱动、歌词画面、包装</text>

      <rect class="route" x="0" y="104" width="246" height="78" rx="16"/>
      <text x="20" y="136" class="label">数字人口播混合</text>
      <text x="20" y="162" class="body">TTS、对口型、素材混剪</text>

      <rect class="route" x="268" y="104" width="246" height="78" rx="16"/>
      <text x="288" y="136" class="label">动作模仿 / 跳舞</text>
      <text x="288" y="162" class="body">参考动作、人物素材、迁移</text>

      <rect class="route" x="536" y="104" width="514" height="78" rx="16"/>
      <text x="556" y="136" class="label">参考视频生成胶囊草稿</text>
      <text x="556" y="162" class="body">提炼结构、节奏、风格与音频策略，确认后写入配方</text>
    </g>

    <g transform="translate(1168 700)">
      <rect x="0" y="0" width="122" height="166" rx="22" fill="url(#soft)" stroke="#60a5fa" stroke-width="1.4"/>
      <text x="61" y="48" text-anchor="middle" class="chip">能力标签</text>
      <path d="M34 66 H88 M34 134 H88" class="line"/>
      <text x="61" y="88" text-anchor="middle" class="chip">硬过滤</text>
      <text x="61" y="118" text-anchor="middle" class="chip">软匹配</text>
      <text x="61" y="150" text-anchor="middle" class="chip">视频配方</text>
    </g>
  </g>
</svg>
