<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 能力标签路由图</title>
  <desc id="desc">展示底层能力如何经过标签、策略和渠道状态匹配成视频生产路线。</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="18" x2="1340" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset="0.55" stop-color="#11182A"/><stop offset="1" stop-color="#171426"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 170) rotate(137) scale(360 520)">
      <stop stop-color="#56E6D6" stop-opacity=".2"/><stop offset="1" stop-color="#56E6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 940) rotate(-62) scale(330 520)">
      <stop stop-color="#A78BFA" stop-opacity=".15"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65F3DE"/><stop offset="1" stop-color="#7C8CFF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B5C7DC" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00030A" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:750;letter-spacing:2.5px}
      .title{font-size:46px;font-weight:780;letter-spacing:-1.2px}
      .subtitle{font-size:18px;font-weight:450}
      .section{font-size:17px;font-weight:740}
      .label{font-size:18px;font-weight:720}
      .body{font-size:14px;font-weight:480}
      .small{font-size:12px;font-weight:620}
      .num{font-size:13px;font-weight:800}
    </style>
  </defs><rect width="1400" height="980" rx="34" fill="url(#bg)"/><rect width="1400" height="980" rx="34" fill="url(#grid)"/><rect width="1400" height="980" rx="34" fill="url(#glowC)"/><rect width="1400" height="980" rx="34" fill="url(#glowV)"/>
  <g class="sans">
    <g transform="translate(72 54)"><rect width="310" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="19" cy="17" r="5" fill="#65F3DE"/><text x="35" y="22" class="eyebrow" fill="#BFD2E8">CAPABILITY ROUTER · 能力路由</text></g>
    <text x="72" y="137" class="title" fill="#F7FAFF">能力标签，不绑定供应商</text>
    <text x="74" y="171" class="subtitle" fill="#93A8C0">配方声明需要什么能力；运行时按标签、限制、凭证状态与渠道政策选择路线。</text>
  </g><g class="sans"><rect x="62" y="210" width="1276" height="330" rx="28" fill="#0D1524" fill-opacity=".9" stroke="#D6EAFF" stroke-opacity=".13"/>
    <text x="88" y="251" class="section" fill="#F1F6FC">01 · 底层能力层</text>
