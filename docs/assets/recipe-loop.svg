<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">视频配方闭环</title>
  <desc id="desc">从需求到分镜、生成、质检、发布，再把稳定经验回写到视频配方。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 750 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 800 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0F766E; }
      .line { stroke: #64748B; stroke-opacity: 0.48; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" class="title">配方闭环：一次跑通，下次少走弯路</text>
  <text x="64" y="100" class="body">Capsule Cinema 不只交付一个视频，它会把稳定的结构、工具选择和质检规则沉淀成下一次可复用的配方。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="160" width="170" height="118" rx="20" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="96" y="196" class="step">01</text>
    <text x="96" y="226" class="label">需求</text>
    <text x="96" y="252" class="body">主题、人群、平台</text>

    <rect x="286" y="160" width="170" height="118" rx="20" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="310" y="196" class="step">02</text>
    <text x="310" y="226" class="label">分镜</text>
    <text x="310" y="252" class="body">节奏和画面结构</text>

    <rect x="500" y="160" width="170" height="118" rx="20" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="524" y="196" class="step">03</text>
    <text x="524" y="226" class="label">生成</text>
    <text x="524" y="252" class="body">图片、视频、TTS</text>

    <rect x="714" y="160" width="170" height="118" rx="20" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="738" y="196" class="step">04</text>
    <text x="738" y="226" class="label">质检</text>
    <text x="738" y="252" class="body">画面、声音、字幕</text>

    <rect x="928" y="160" width="170" height="118" rx="20" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="952" y="196" class="step">05</text>
    <text x="952" y="226" class="label">发布</text>
    <text x="952" y="252" class="body">成片和发布检查</text>
  </g>

  <path d="M246 219 H282" class="line"/>
  <path d="M460 219 H496" class="line"/>
  <path d="M674 219 H710" class="line"/>
  <path d="M888 219 H924" class="line"/>

  <path d="M1014 282 C990 350 430 356 260 282" class="line" stroke-dasharray="8 8"/>
  <rect x="458" y="318" width="350" height="54" rx="27" fill="#0F766E" fill-opacity="0.12" stroke="#0F766E" stroke-opacity="0.28"/>
  <text x="494" y="352" class="label">把有效经验回写到视频配方</text>
</svg>
