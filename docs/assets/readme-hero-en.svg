<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema workflow from brief to release package</title>
  <desc id="desc">Shows how Capsule Cinema turns a video brief into a storyboard, recipe route, tool execution, QA, and release package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="videoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="videoB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 62px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 500 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #475569; }
      .label { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #111827; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #475569; }
      .small { font: 650 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .code { font: 650 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .chip { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; fill: #0f766e; }
      .card { fill: #ffffff; stroke: #dbe6e3; stroke-width: 1.2; }
      .panel { fill: #ffffff; stroke: #d8e3df; stroke-width: 1.2; }
      .line { stroke: #0f766e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1210" cy="116" r="76" fill="#f59e0b" opacity="0.08"/>
  <circle cx="1110" cy="642" r="110" fill="#0f766e" opacity="0.07"/>

  <text x="72" y="94" class="title">Capsule Cinema</text>
  <text x="72" y="138" class="subtitle">Turn a working AI video process into a reusable video recipe</text>

  <g transform="translate(72 184)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="356" height="408" rx="22"/>
    <rect x="24" y="24" width="110" height="30" rx="15" fill="#ecfdf5"/>
    <text x="42" y="45" class="chip">INPUT BRIEF</text>
    <text x="24" y="96" class="label">Review the plan before spending</text>
    <text x="24" y="132" class="body">Topic: portable coffee cup video</text>
    <text x="24" y="164" class="body">Audience: creators and teams</text>
    <text x="24" y="196" class="body">Format: 30s vertical, narrated</text>
    <path d="M24 242 H332" class="muted"/>
    <text x="24" y="286" class="code">--storyboard_only</text>
    <text x="24" y="322" class="code">--capsule ecommerce_product_showcase</text>
    <text x="24" y="358" class="code">--aspect_ratio 9:16</text>
  </g>

  <g transform="translate(514 184)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="372" height="408" rx="22"/>
    <rect x="24" y="24" width="126" height="30" rx="15" fill="#eff6ff"/>
    <text x="42" y="45" class="chip" fill="#1d4ed8">RECIPE ROUTE</text>
    <text x="24" y="92" class="label">Capsules keep what worked</text>
    <g transform="translate(24 126)">
      <rect class="card" x="0" y="0" width="324" height="58" rx="14"/>
      <text x="18" y="36" class="code">capsule.yaml</text>
      <rect class="card" x="0" y="76" width="324" height="58" rx="14"/>
      <text x="18" y="112" class="code">recipes/structure.md</text>
      <rect class="card" x="0" y="152" width="324" height="58" rx="14"/>
      <text x="18" y="188" class="code">quality/release_gates.yaml</text>
      <rect class="card" x="0" y="228" width="324" height="58" rx="14"/>
      <text x="18" y="264" class="code">learning/promoted_lessons.yaml</text>
    </g>
  </g>

  <g transform="translate(972 150)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="356" height="476" rx="22"/>
    <rect x="24" y="24" width="132" height="30" rx="15" fill="#fff7ed"/>
    <text x="42" y="45" class="chip" fill="#c2410c">RELEASE PACKAGE</text>
    <text x="24" y="92" class="label">More than a single mp4</text>

    <g transform="translate(28 122)">
      <rect x="0" y="0" width="132" height="236" rx="20" fill="url(#videoA)"/>
      <rect x="20" y="22" width="92" height="68" rx="12" fill="#ffffff" opacity="0.24"/>
      <circle cx="66" cy="136" r="34" fill="#ffffff" opacity="0.32"/>
      <path d="M58 120 L84 136 L58 152 Z" fill="#ffffff"/>
      <text x="66" y="210" text-anchor="middle" style="font:800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#fff">final.mp4</text>

      <rect x="162" y="0" width="132" height="236" rx="20" fill="url(#videoB)"/>
      <rect x="184" y="24" width="88" height="32" rx="10" fill="#ffffff" opacity="0.28"/>
      <rect x="184" y="76" width="88" height="32" rx="10" fill="#ffffff" opacity="0.28"/>
      <rect x="184" y="128" width="88" height="32" rx="10" fill="#ffffff" opacity="0.28"/>
      <text x="228" y="210" text-anchor="middle" style="font:800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#fff">QA</text>
    </g>

    <g transform="translate(24 386)">
      <text x="0" y="0" class="small">release/release_checkpoint.json</text>
      <text x="0" y="30" class="small">work/edit_plan.json</text>
      <text x="0" y="60" class="small">artifact_manifest.json</text>
    </g>
  </g>

  <path class="line" d="M444 388 H498"/>
  <path class="line" d="M902 388 H956"/>
  <path d="M492 376 L510 388 L492 400 Z" fill="#0f766e"/>
  <path d="M950 376 L968 388 L950 400 Z" fill="#0f766e"/>

  <g transform="translate(72 640)">
    <rect x="0" y="0" width="1256" height="62" rx="20" fill="#0f172a"/>
    <text x="30" y="40" style="font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d1fae5">brief -> storyboard -> tools -> media -> edit plan -> QA -> release checkpoint</text>
  </g>
</svg>
