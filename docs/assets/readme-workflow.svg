<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 工作流</title>
  <desc id="desc">从需求、分镜、工具调度、素材生成、质量检查到经验回写的闭环。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .step { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .code { font: 700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #0f766e; }
      .card { fill: #ffffff; stroke: #dce7e3; stroke-width: 1.2; }
      .line { stroke: #0f766e; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1400" height="520" rx="32" fill="#ffffff"/>
  <text x="64" y="78" class="title">从需求到可复用配方</text>
  <text x="64" y="114" class="subtitle">先审方案，再调工具，最后把稳定经验写回 Capsule。</text>

  <g transform="translate(64 176)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="180" height="180" rx="20"/>
    <circle cx="42" cy="44" r="18" fill="#ccfbf1"/>
    <text x="42" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#0f766e">1</text>
    <text x="24" y="94" class="step">输入需求</text>
    <text x="24" y="128" class="body">主题、人群</text>
    <text x="24" y="154" class="body">素材、风格</text>

    <rect class="card" x="218" y="0" width="180" height="180" rx="20"/>
    <circle cx="260" cy="44" r="18" fill="#dbeafe"/>
    <text x="260" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#1d4ed8">2</text>
    <text x="242" y="94" class="step">可审分镜</text>
    <text x="242" y="128" class="body">结构、节奏</text>
    <text x="242" y="154" class="code">storyboard.json</text>

    <rect class="card" x="436" y="0" width="180" height="180" rx="20"/>
    <circle cx="478" cy="44" r="18" fill="#fef3c7"/>
    <text x="478" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#b45309">3</text>
    <text x="460" y="94" class="step">能力匹配</text>
    <text x="460" y="128" class="body">图片、视频</text>
    <text x="460" y="154" class="body">TTS、BGM</text>

    <rect class="card" x="654" y="0" width="180" height="180" rx="20"/>
    <circle cx="696" cy="44" r="18" fill="#fae8ff"/>
    <text x="696" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#a21caf">4</text>
    <text x="678" y="94" class="step">生成素材</text>
    <text x="678" y="128" class="body">镜头、配音</text>
    <text x="678" y="154" class="body">字幕、剪辑</text>

    <rect class="card" x="872" y="0" width="180" height="180" rx="20"/>
    <circle cx="914" cy="44" r="18" fill="#fee2e2"/>
    <text x="914" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#b91c1c">5</text>
    <text x="896" y="94" class="step">本地 QA</text>
    <text x="896" y="128" class="body">画幅、声音</text>
    <text x="896" y="154" class="body">字幕、阻断项</text>

    <rect class="card" x="1090" y="0" width="180" height="180" rx="20"/>
    <circle cx="1132" cy="44" r="18" fill="#ecfccb"/>
    <text x="1132" y="52" text-anchor="middle" style="font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;fill:#4d7c0f">6</text>
    <text x="1114" y="94" class="step">经验回写</text>
    <text x="1114" y="128" class="body">稳定结构</text>
    <text x="1114" y="154" class="body">沉淀配方</text>
  </g>

  <g>
    <path class="line" d="M254 266 H294"/>
    <path class="line" d="M472 266 H512"/>
    <path class="line" d="M690 266 H730"/>
    <path class="line" d="M908 266 H948"/>
    <path class="line" d="M1126 266 H1166"/>
    <path d="M288 254 L306 266 L288 278 Z" fill="#0f766e"/>
    <path d="M506 254 L524 266 L506 278 Z" fill="#0f766e"/>
    <path d="M724 254 L742 266 L724 278 Z" fill="#0f766e"/>
    <path d="M942 254 L960 266 L942 278 Z" fill="#0f766e"/>
    <path d="M1160 254 L1178 266 L1160 278 Z" fill="#0f766e"/>
  </g>

  <path d="M1174 390 C870 470 520 470 216 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="604" y="486" class="subtitle">满意的结果会成为下一次的起点</text>
</svg>
