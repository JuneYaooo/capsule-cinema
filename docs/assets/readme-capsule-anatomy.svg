<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule 包结构</title>
  <desc id="desc">展示 Capsule 包如何保存输入合同、制作配方、资产、质量规则和经验。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .heading { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .code { font: 700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #334155; }
      .card { fill: #ffffff; stroke: #dce7e3; stroke-width: 1.2; }
      .tag { font: 800 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .line { stroke: #0f766e; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1400" height="620" rx="32" fill="#f8fafc"/>
  <text x="64" y="78" class="title">Capsule 是可迁移的视频工作流包</text>
  <text x="64" y="114" class="subtitle">它保存一类视频的不变量，而不是保存一次性运行产物或密钥。</text>

  <g transform="translate(64 160)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="520" height="390" rx="22"/>
    <text x="28" y="48" class="heading">capsules/ecommerce_product_showcase.capsule/</text>
    <text x="28" y="92" class="code">├─ capsule.yaml</text>
    <text x="28" y="128" class="code">├─ index.md</text>
    <text x="28" y="164" class="code">├─ contracts/</text>
    <text x="28" y="200" class="code">│  ├─ input_schema.yaml</text>
    <text x="28" y="236" class="code">│  └─ runtime.yaml</text>
    <text x="28" y="272" class="code">├─ recipes/</text>
    <text x="28" y="308" class="code">├─ quality/</text>
    <text x="28" y="344" class="code">└─ learning/</text>
  </g>

  <g transform="translate(650 166)" filter="url(#shadow)">
    <rect class="card" x="0" y="0" width="298" height="156" rx="20"/>
    <rect x="24" y="24" width="92" height="28" rx="14" fill="#ecfdf5"/>
    <text x="43" y="44" class="tag">CONTRACT</text>
    <text x="24" y="82" class="heading">输入和边界</text>
    <text x="24" y="118" class="body">需要哪些素材、时长、画幅</text>

    <rect class="card" x="336" y="0" width="298" height="156" rx="20"/>
    <rect x="360" y="24" width="86" height="28" rx="14" fill="#eff6ff"/>
    <text x="380" y="44" class="tag" fill="#1d4ed8">RECIPE</text>
    <text x="360" y="82" class="heading">结构和风格</text>
    <text x="360" y="118" class="body">分镜、视觉、文案、声音</text>

    <rect class="card" x="0" y="194" width="298" height="156" rx="20"/>
    <rect x="24" y="218" width="78" height="28" rx="14" fill="#fff7ed"/>
    <text x="44" y="238" class="tag" fill="#c2410c">TOOLS</text>
    <text x="24" y="276" class="heading">工具路线</text>
    <text x="24" y="312" class="body">声明能力，运行时匹配</text>

    <rect class="card" x="336" y="194" width="298" height="156" rx="20"/>
    <rect x="360" y="218" width="64" height="28" rx="14" fill="#fef2f2"/>
    <text x="380" y="238" class="tag" fill="#b91c1c">QA</text>
    <text x="360" y="276" class="heading">质量门</text>
    <text x="360" y="312" class="body">阻断项、修复建议、发布检查</text>
  </g>

  <path class="line" d="M594 356 H632"/>
  <path d="M626 344 L644 356 L626 368 Z" fill="#0f766e"/>
</svg>
