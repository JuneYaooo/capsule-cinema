<svg width="1400" height="700" viewBox="0 0 1400 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule 是可迁移的视频工作流包</title>
  <desc id="desc">展示胶囊目录与输入合同、制作配方、工具路线、质量门之间的映射。</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="18" x2="1340" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset="0.55" stop-color="#11182A"/><stop offset="1" stop-color="#171426"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 170) rotate(137) scale(360 520)">
      <stop stop-color="#56E6D6" stop-opacity=".2"/><stop offset="1" stop-color="#56E6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 660) rotate(-62) scale(330 520)">
      <stop stop-color="#A78BFA" stop-opacity=".15"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65F3DE"/><stop offset="1" stop-color="#7C8CFF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B5C7DC" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00030A" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:750;letter-spacing:2.5px}
      .title{font-size:46px;font-weight:780;letter-spacing:-1.2px}
      .subtitle{font-size:18px;font-weight:450}
      .section{font-size:17px;font-weight:740}
      .label{font-size:18px;font-weight:720}
      .body{font-size:14px;font-weight:480}
      .small{font-size:12px;font-weight:620}
      .num{font-size:13px;font-weight:800}
    </style>
  </defs><rect width="1400" height="700" rx="34" fill="url(#bg)"/><rect width="1400" height="700" rx="34" fill="url(#grid)"/><rect width="1400" height="700" rx="34" fill="url(#glowC)"/><rect width="1400" height="700" rx="34" fill="url(#glowV)"/>
  <g class="sans">
    <g transform="translate(72 54)"><rect width="310" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="19" cy="17" r="5" fill="#65F3DE"/><text x="35" y="22" class="eyebrow" fill="#BFD2E8">CAPSULE ANATOMY · 胶囊结构</text></g>
    <text x="72" y="137" class="title" fill="#F7FAFF">胶囊保存方法，不保存某一期</text>
    <text x="74" y="171" class="subtitle" fill="#93A8C0">它封装可复用合同、制作知识、能力需求和质量规则；本期内容仍来自本期输入。</text>
  </g><g transform="translate(62 218)" class="sans" filter="url(#shadow)"><rect width="624" height="414" rx="28" fill="#0D1524" fill-opacity=".92" stroke="#D6EAFF" stroke-opacity=".13"/>
    <rect x="26" y="24" width="190" height="32" rx="16" fill="#65F3DE" fill-opacity=".1" stroke="#65F3DE" stroke-opacity=".22"/><circle cx="43" cy="40" r="4" fill="#65F3DE"/><text x="56" y="45" class="small mono" fill="#9EF4E8">ACTIVE PACKAGE</text>
    <text x="27" y="94" class="section mono" fill="#F3F7FC">capsules/&lt;name&gt;.capsule/</text>
    <path d="M28 118H596" stroke="#FFFFFF" stroke-opacity=".09"/><text x="34" y="150" class="body mono" fill="#DDE8F4">├─ capsule.yaml</text><text x="274" y="150" class="small" fill="#607790">manifest + read order</text><text x="34" y="184" class="body mono" fill="#DDE8F4">├─ index.md</text><text x="274" y="184" class="small" fill="#607790">stage-readable index</text><text x="34" y="218" class="body mono" fill="#DDE8F4">├─ CARD.md</text><text x="274" y="218" class="small" fill="#607790">human-facing summary</text><text x="34" y="252" class="body mono" fill="#A9BAD0">├─ contracts/</text><text x="274" y="252" class="small" fill="#607790">inputs · runtime · scope</text><text x="34" y="286" class="body mono" fill="#A9BAD0">├─ recipes/</text><text x="274" y="286" class="small" fill="#607790">structure · visual · audio</text><text x="34" y="320" class="body mono" fill="#A9BAD0">├─ quality/</text><text x="274" y="320" class="small" fill="#607790">rules · release gates</text><text x="34" y="354" class="body mono" fill="#A9BAD0">├─ learning/</text><text x="274" y="354" class="small" fill="#607790">promoted lessons only</text><rect x="28" y="376" width="568" height="1" fill="#FFFFFF" fill-opacity=".08"/><text x="30" y="400" class="small mono" fill="#7C8CFF">NO SECRETS · NO RUN OUTPUT · NO TEMP URL</text></g><path d="M706 424H756" stroke="#65F3DE" stroke-width="2"/><path d="M747 416L758 424L747 432" stroke="#65F3DE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(782 218)" class="sans" filter="url(#shadow)"><rect width="254" height="180" rx="22" fill="#0C1422" stroke="#D6EAFF" stroke-opacity=".13"/><rect x="20" y="20" width="82" height="26" rx="13" fill="#65F3DE" fill-opacity=".11" stroke="#65F3DE" stroke-opacity=".2"/><text x="61" y="38" text-anchor="middle" class="small mono" fill="#65F3DE">CONTRACT</text><text x="20" y="83" class="label" fill="#F3F7FC">输入和边界</text><text x="20" y="112" class="body" fill="#91A5BC">需要哪些素材、时长、画幅</text><path d="M20 136H234" stroke="#FFFFFF" stroke-opacity=".08"/><text x="20" y="160" class="small mono" fill="#65F3DE">input_schema.yaml</text></g><g transform="translate(1064 218)" class="sans" filter="url(#shadow)"><rect width="254" height="180" rx="22" fill="#0C1422" stroke="#D6EAFF" stroke-opacity=".13"/><rect x="20" y="20" width="82" height="26" rx="13" fill="#7C8CFF" fill-opacity=".11" stroke="#7C8CFF" stroke-opacity=".2"/><text x="61" y="38" text-anchor="middle" class="small mono" fill="#7C8CFF">RECIPE</text><text x="20" y="83" class="label" fill="#F3F7FC">结构和风格</text><text x="20" y="112" class="body" fill="#91A5BC">分镜、视觉、文案、声音</text><path d="M20 136H234" stroke="#FFFFFF" stroke-opacity=".08"/><text x="20" y="160" class="small mono" fill="#7C8CFF">recipes/</text></g><g transform="translate(782 426)" class="sans" filter="url(#shadow)"><rect width="254" height="180" rx="22" fill="#0C1422" stroke="#D6EAFF" stroke-opacity=".13"/><rect x="20" y="20" width="82" height="26" rx="13" fill="#FFB86B" fill-opacity=".11" stroke="#FFB86B" stroke-opacity=".2"/><text x="61" y="38" text-anchor="middle" class="small mono" fill="#FFB86B">TOOLS</text><text x="20" y="83" class="label" fill="#F3F7FC">工具路线</text><text x="20" y="112" class="body" fill="#91A5BC">声明能力，运行时匹配</text><path d="M20 136H234" stroke="#FFFFFF" stroke-opacity=".08"/><text x="20" y="160" class="small mono" fill="#FFB86B">runtime.yaml</text></g><g transform="translate(1064 426)" class="sans" filter="url(#shadow)"><rect width="254" height="180" rx="22" fill="#0C1422" stroke="#D6EAFF" stroke-opacity=".13"/><rect x="20" y="20" width="82" height="26" rx="13" fill="#FF8F9B" fill-opacity=".11" stroke="#FF8F9B" stroke-opacity=".2"/><text x="61" y="38" text-anchor="middle" class="small mono" fill="#FF8F9B">QA</text><text x="20" y="83" class="label" fill="#F3F7FC">质量门</text><text x="20" y="112" class="body" fill="#91A5BC">阻断项、修复建议、发布检查</text><path d="M20 136H234" stroke="#FFFFFF" stroke-opacity=".08"/><text x="20" y="160" class="small mono" fill="#FF8F9B">quality/</text></g></svg>
