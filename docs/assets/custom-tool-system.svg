<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 自定义工具体系</title>
  <desc id="desc">style:swimlane-pipeline。图像、视频、TTS、BGM、字幕、剪辑和 QA 工具沿泳道进入能力声明、制作前检查和配方执行。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.45" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 750 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .section { font: 750 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .body { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .code { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0F766E; }
      .line { stroke: #64748B; stroke-opacity: 0.38; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">自定义工具体系：工具可以换，配方按能力工作</text>
  <text x="64" y="96" class="body">把自己的生成渠道、音频服务、后期脚本或质检工具接入后，Capsule Cinema 会在制作前检查可用性和风险。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="132" width="1152" height="350" rx="28" fill="#FFFFFF" fill-opacity="0.86" stroke="#D7DEE8"/>
    <rect x="92" y="166" width="154" height="42" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="122" y="192" class="section">工具来源</text>
    <rect x="320" y="166" width="188" height="42" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="360" y="192" class="section">能力声明</text>
    <rect x="582" y="166" width="214" height="42" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="632" y="192" class="section">制作前检查</text>
    <rect x="884" y="166" width="218" height="42" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="938" y="192" class="section">配方执行</text>

    <rect x="92" y="236" width="154" height="34" rx="17" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="124" y="258" class="label">图像生成</text>
    <rect x="92" y="284" width="154" height="34" rx="17" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="124" y="306" class="label">视频生成</text>
    <rect x="92" y="332" width="154" height="34" rx="17" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="137" y="354" class="label">TTS / BGM</text>
    <rect x="92" y="380" width="154" height="34" rx="17" fill="#FCE7F3" stroke="#F9A8D4"/>
    <text x="132" y="402" class="label">字幕 / 剪辑</text>
    <rect x="92" y="428" width="154" height="28" rx="14" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="132" y="447" class="tiny">QA 质量检查</text>

    <rect x="320" y="238" width="188" height="54" rx="18" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="352" y="261" class="label">能做什么</text>
    <text x="352" y="280" class="code">image_to_video</text>
    <rect x="320" y="314" width="188" height="54" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="352" y="337" class="label">需要凭证</text>
    <text x="352" y="356" class="code">key / token</text>
    <rect x="320" y="390" width="188" height="42" rx="18" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="352" y="416" class="label">成本和产物路径</text>

    <rect x="582" y="238" width="214" height="42" rx="21" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="620" y="264" class="label">凭证检查</text>
    <rect x="582" y="296" width="214" height="42" rx="21" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="620" y="322" class="label">能力匹配</text>
    <rect x="582" y="354" width="214" height="42" rx="21" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="620" y="380" class="label">替代路线</text>
    <rect x="582" y="412" width="214" height="42" rx="21" fill="#FCE7F3" stroke="#F9A8D4"/>
    <text x="620" y="438" class="label">用户确认</text>

    <rect x="884" y="238" width="218" height="54" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="922" y="270" class="label">读取配方需求</text>
    <rect x="884" y="314" width="218" height="54" rx="18" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="922" y="346" class="label">选择已确认工具</text>
    <rect x="884" y="390" width="218" height="54" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="922" y="422" class="label">产物进入 QA</text>
  </g>

  <path d="M250 254 H314" class="line"/>
  <path d="M250 302 H314" class="line"/>
  <path d="M250 350 H314" class="line"/>
  <path d="M250 398 H314" class="line"/>
  <path d="M512 314 H576" class="line"/>
  <path d="M800 314 H878" class="line"/>
  <path d="M800 432 C842 432 850 420 878 418" class="line"/>

  <g filter="url(#shadow)">
    <rect x="128" y="504" width="1024" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1"/>
    <text x="164" y="526" class="label">项目原则</text>
    <text x="252" y="526" class="tiny">配方说“需要什么能力”，工具说“我能提供什么能力”，制作前检查凭证、成本、替代路线和质量风险。</text>
  </g>
</svg>
