<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 功能设计巧思总览</title>
  <desc id="desc">style:radial-orbit。一张环形总览图整合创作闭环、配方体系、工具能力、质量门、经验回写和可复用配方。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.5" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 294) rotate(90) scale(184 230)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </radialGradient>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 750 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .section { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .body { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .code { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0F766E; }
      .ring { stroke: #94A3B8; stroke-opacity: 0.28; stroke-width: 2.5; fill: none; }
      .line { stroke: #64748B; stroke-opacity: 0.36; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">功能设计巧思：一条可迭代的视频生产轨道</text>
  <text x="64" y="96" class="body">创作闭环、配方体系、工具能力和质量门围绕同一个目标工作：把跑通的方法变成可复用配方。</text>

  <ellipse cx="640" cy="294" rx="392" ry="168" class="ring"/>
  <ellipse cx="640" cy="294" rx="286" ry="122" class="ring"/>
  <path d="M248 294 C308 170 498 118 640 118 C782 118 972 170 1032 294" class="line"/>
  <path d="M248 294 C306 424 494 476 640 476 C786 476 974 424 1032 294" class="line"/>

  <g filter="url(#shadow)">
    <circle cx="640" cy="294" r="116" fill="url(#centerGlow)" stroke="#FFFFFF"/>
    <circle cx="640" cy="294" r="88" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="588" y="276" class="section">可复用配方</text>
    <text x="552" y="304" class="body">结构、风格、工具、质量规则</text>
    <text x="560" y="330" class="code">capsules/&lt;name&gt;.capsule</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="104" y="214" width="228" height="106" rx="22" fill="#FFFFFF" stroke="#FED7AA"/>
    <rect x="130" y="242" width="72" height="30" rx="15" fill="#FFEDD5" stroke="#FDBA74"/>
    <text x="148" y="262" class="tiny">需求</text>
    <rect x="214" y="242" width="72" height="30" rx="15" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="232" y="262" class="tiny">分镜</text>
    <text x="130" y="296" class="label">创作闭环</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="118" width="380" height="86" rx="24" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="486" y="154" class="label">配方体系</text>
    <text x="486" y="178" class="tiny">初始配方 / 个人配方 / 社区配方</text>
    <rect x="718" y="140" width="82" height="28" rx="14" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="740" y="159" class="tiny">沉淀</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="948" y="214" width="228" height="106" rx="22" fill="#FFFFFF" stroke="#BAE6FD"/>
    <text x="982" y="252" class="label">工具能力</text>
    <text x="982" y="276" class="tiny">图像 / 视频 / TTS / BGM / QA</text>
    <rect x="982" y="292" width="152" height="14" rx="7" fill="#E0F2FE"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="194" y="386" width="250" height="82" rx="22" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="226" y="424" class="label">质量门</text>
    <text x="226" y="448" class="tiny">画面、声音、字幕、画幅、降级风险</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="836" y="386" width="250" height="82" rx="22" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="868" y="424" class="label">经验回写</text>
    <text x="868" y="448" class="tiny">把有效结构和返工经验写回配方</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="474" y="478" width="332" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1"/>
    <text x="520" y="504" class="tiny">同一套链路：先跑通，再复用，再迭代</text>
    <rect x="730" y="488" width="42" height="14" rx="7" fill="#FCE7F3"/>
  </g>
</svg>
