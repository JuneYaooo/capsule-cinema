<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">自定义工具接入流程</title>
  <desc id="desc">配方描述能力需求，工具声明能力和凭证，运行前做匹配、预检和确认。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#F0FDFA"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
    <style>
      .title { font: 750 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .labelLight { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .body { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .bodyLight { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .code { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .line { stroke: #64748B; stroke-opacity: 0.46; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" class="title">自定义工具怎么接入：配方说需求，工具说能力</text>
  <text x="64" y="100" class="body">你不用把配方绑死到某个平台。新增工具后，系统会按能力、凭证和质量规则做匹配。</text>

  <g filter="url(#shadow)">
    <rect x="82" y="158" width="248" height="146" rx="22" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="112" y="198" class="label">视频配方</text>
    <text x="112" y="226" class="body">需要图像、视频、TTS、BGM</text>
    <text x="112" y="254" class="code">capabilities: image_to_video</text>
    <text x="112" y="280" class="code">quality: no silent downgrade</text>

    <rect x="396" y="130" width="248" height="92" rx="22" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="426" y="168" class="label">工具能力库</text>
    <text x="426" y="196" class="body">每个工具能做什么、成本和限制</text>

    <rect x="396" y="254" width="248" height="92" rx="22" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="426" y="292" class="label">调用注册表</text>
    <text x="426" y="320" class="body">脚本入口、参数和返回产物</text>

    <rect x="710" y="158" width="248" height="146" rx="22" fill="#FFFFFF" stroke="#D7DEE8"/>
    <text x="740" y="198" class="label">Preflight</text>
    <text x="740" y="226" class="body">检查凭证、替代工具和降级风险</text>
    <text x="740" y="254" class="code">needs_confirmation</text>
    <text x="740" y="280" class="code">or ready_to_generate</text>

    <rect x="1024" y="158" width="174" height="146" rx="22" fill="#0F172A" fill-opacity="0.92"/>
    <text x="1054" y="198" class="labelLight">生成路线</text>
    <text x="1054" y="226" class="bodyLight">按已确认工具执行</text>
    <text x="1054" y="254" class="bodyLight">产物进入 QA</text>
  </g>

  <path d="M334 230 H390" class="line"/>
  <path d="M648 176 C676 176 688 192 706 210" class="line"/>
  <path d="M648 300 C676 300 688 270 706 248" class="line"/>
  <path d="M962 230 H1018" class="line"/>
</svg>
