<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 配方体系</title>
  <desc id="desc">style:recipe-garden-map。seedIsland、personalIsland、communityIsland 和 shareHarbor 像配方花园地图一样汇入 Capsule 视频配方包，再流向复用、迭代和分享。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.48" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="capsule" x1="420" y1="154" x2="850" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEDD5"/>
      <stop offset="0.35" stop-color="#CCFBF1"/>
      <stop offset="0.7" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-22%" width="132%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#64748B" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .body{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5B6B84}
      .section{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .label{font:800 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .tiny{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#607089}
      .code{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#00796F}
      .codeDark{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#35445D}
    </style>
  </defs>

  <rect width="1280" height="560" rx="30" fill="url(#bg)"/>
  <path d="M56 138C140 112 254 118 340 166C416 208 462 200 538 172C626 140 736 144 824 184C918 226 1010 204 1178 144" stroke="#FFFFFF" stroke-width="34" stroke-opacity="0.36" stroke-linecap="round"/>
  <path d="M62 504C168 466 276 476 392 504C512 532 610 518 706 480C812 438 932 446 1194 496" stroke="#FFFFFF" stroke-width="38" stroke-opacity="0.32" stroke-linecap="round"/>
  <path d="M376 244C454 164 826 162 908 244" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="10 12"/>
  <path d="M376 374C462 444 814 446 906 374" stroke="#F9A8D4" stroke-width="2" stroke-opacity="0.36" stroke-dasharray="10 12"/>
  <text x="64" y="68" class="title">配方体系：从种子案例到个人资产，再到社区共创</text>
  <text x="64" y="98" class="body">Capsule Cinema 把一类视频的结构、风格、素材语义、工具路线、质量规则和返工经验保存成可迁移的视频配方。</text>

  <path d="M286 214C356 200 388 224 438 260" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M286 330C358 326 390 310 438 296" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M318 438C370 412 396 360 440 330" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M840 268C900 230 916 202 968 198" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M840 318C904 330 922 350 976 350" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>
  <path d="M840 360C900 398 916 438 958 444" stroke="#B9C6D6" stroke-width="3" stroke-linecap="round"/>

  <g id="seedIsland" filter="url(#shadow)">
    <path d="M86 166C112 140 252 134 288 176C312 204 290 236 250 248C194 264 96 252 76 220C66 204 70 184 86 166Z" fill="#FFF7ED" fill-opacity="0.68"/>
    <path d="M92 154H254C276 154 294 172 294 194V210C294 232 276 250 254 250H112C90 250 72 232 72 210V174C72 163 81 154 92 154Z" fill="#FFFFFF" stroke="#FDBA74"/>
    <circle cx="96" cy="174" r="10" fill="#FFEDD5"/>
    <text x="104" y="190" class="section">初始配方</text>
    <text x="104" y="216" class="tiny">项目内置种子案例</text>
    <text x="104" y="238" class="codeDark">life_sim / art_motion</text>
  </g>

  <g id="personalIsland" filter="url(#shadow)">
    <path d="M78 304C110 276 244 280 288 304C326 326 296 366 246 376C176 390 82 374 68 342C62 328 66 314 78 304Z" fill="#CCFBF1" fill-opacity="0.52"/>
    <path d="M88 292H260C282 292 300 310 300 332V334C300 356 282 374 260 374H108C86 374 68 356 68 334V312C68 301 77 292 88 292Z" fill="#FFFFFF" stroke="#5EEAD4"/>
    <circle cx="276" cy="316" r="10" fill="#CCFBF1"/>
    <text x="104" y="328" class="section">个人配方</text>
    <text x="104" y="352" class="tiny">沉淀账号、品牌、项目经验</text>
  </g>

  <g id="communityIsland" filter="url(#shadow)">
    <path d="M108 424C142 396 296 402 326 430C354 456 320 492 258 500C184 510 104 492 96 462C92 448 96 434 108 424Z" fill="#E0F2FE" fill-opacity="0.5"/>
    <path d="M116 414H294C316 414 334 432 334 454V456C334 478 316 496 294 496H136C114 496 96 478 96 456V434C96 423 105 414 116 414Z" fill="#FFFFFF" stroke="#7DD3FC"/>
    <circle cx="310" cy="442" r="10" fill="#E0F2FE"/>
    <text x="128" y="448" class="section">社区配方</text>
    <text x="128" y="472" class="tiny">通过 Issue 或社群分享、试用、改进</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M458 170C502 126 756 124 818 172C870 212 856 344 812 394C762 450 512 434 460 392C414 354 414 214 458 170Z" fill="#ECFEFF" fill-opacity="0.54"/>
    <rect x="442" y="150" width="396" height="268" rx="48" fill="url(#capsule)"/>
    <rect x="474" y="182" width="332" height="204" rx="30" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF"/>
    <text x="520" y="224" class="section">Capsule 视频配方包</text>
    <text x="520" y="250" class="code">capsules/&lt;name&gt;.capsule</text>
    <rect x="514" y="278" width="118" height="34" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="534" y="300" class="codeDark">capsule.yaml</text>
    <rect x="646" y="278" width="118" height="34" rx="14" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="672" y="300" class="codeDark">contracts/</text>
    <rect x="514" y="324" width="118" height="34" rx="14" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="540" y="346" class="codeDark">recipes/</text>
    <rect x="646" y="324" width="118" height="34" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="672" y="346" class="codeDark">quality/</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M970 166C1000 142 1164 142 1190 174C1218 208 1172 240 1096 246C1010 252 958 234 956 202C956 188 960 176 970 166Z" fill="#CCFBF1" fill-opacity="0.36"/>
    <rect x="958" y="154" width="236" height="86" rx="28" fill="#FFFFFF" stroke="#5EEAD4"/>
    <text x="992" y="190" class="section">复用下一期</text>
    <text x="992" y="216" class="tiny">换主题、换素材，保留结构和质检</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M988 318C1028 288 1180 298 1206 330C1232 364 1190 394 1112 398C1024 404 974 382 974 350C974 338 978 328 988 318Z" fill="#E0F2FE" fill-opacity="0.36"/>
    <rect x="976" y="306" width="236" height="86" rx="28" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="1010" y="342" class="section">迭代已有配方</text>
    <text x="1010" y="368" class="tiny">把更稳的镜头、节奏、工具路线写回去</text>
  </g>

  <g id="shareHarbor" filter="url(#shadow)">
    <path d="M956 426C992 398 1166 402 1198 432C1228 460 1184 494 1108 500C1018 508 946 488 944 456C944 444 948 434 956 426Z" fill="#FCE7F3" fill-opacity="0.42"/>
    <rect x="944" y="414" width="260" height="82" rx="28" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="978" y="450" class="section">分享给社区</text>
    <text x="978" y="474" class="tiny">先清理敏感信息，再让别人试和改</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="454" width="516" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1"/>
    <text x="416" y="484" class="label">安全边界</text>
    <text x="508" y="484" class="tiny">不保存客户资料、密钥、私有素材和成片产物。</text>
    <text x="508" y="506" class="codeDark">learning/</text>
    <text x="596" y="506" class="tiny">真实返工后的通用经验</text>
    <rect x="812" y="470" width="28" height="12" rx="6" fill="#FFEDD5"/>
    <rect x="848" y="470" width="28" height="12" rx="6" fill="#FCE7F3"/>
  </g>
</svg>
