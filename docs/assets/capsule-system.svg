<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capsule Cinema 配方体系</title>
  <desc id="desc">style:ecosystem-map。初始配方、个人配方和社区配方像生态地图一样汇入 Capsule 视频配方包，再用于复用下一期、迭代已有配方和分享给社区。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.48" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="capsule" x1="420" y1="168" x2="842" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset="0.4" stop-color="#A7F3D0"/>
      <stop offset="0.72" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 750 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .section { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .body { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .code { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0F766E; }
      .codeDark { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .line { stroke: #64748B; stroke-opacity: 0.34; stroke-width: 2.5; stroke-linecap: round; }
      .dash { stroke: #64748B; stroke-opacity: 0.32; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 9; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">配方体系：从种子案例到个人资产，再到社区共创</text>
  <text x="64" y="96" class="body">Capsule Cinema 把一类视频的结构、风格、素材语义、工具路线、质量规则和返工经验保存成可迁移的视频配方。</text>

  <path d="M236 214 C332 160 448 142 552 166" class="line"/>
  <path d="M228 330 C332 326 418 314 510 286" class="line"/>
  <path d="M284 442 C390 430 466 386 534 338" class="line"/>
  <path d="M760 168 C876 136 1016 156 1096 220" class="line"/>
  <path d="M770 286 C884 300 984 326 1088 342" class="line"/>
  <path d="M744 344 C856 428 982 454 1098 430" class="line"/>

  <g filter="url(#shadow)">
    <rect x="72" y="154" width="222" height="94" rx="24" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="104" y="190" class="section">初始配方</text>
    <text x="104" y="214" class="tiny">项目内置种子案例</text>
    <text x="104" y="234" class="codeDark">life_sim / art_motion</text>

    <rect x="68" y="292" width="230" height="82" rx="24" fill="#FFFFFF" stroke="#5EEAD4"/>
    <text x="104" y="328" class="section">个人配方</text>
    <text x="104" y="352" class="tiny">沉淀账号、品牌、项目经验</text>

    <rect x="96" y="414" width="238" height="76" rx="24" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="128" y="448" class="section">社区配方</text>
    <text x="128" y="472" class="tiny">通过 Issue 或社群分享、试用、改进</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="442" y="150" width="396" height="262" rx="42" fill="url(#capsule)"/>
    <rect x="474" y="182" width="332" height="198" rx="28" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF"/>
    <text x="520" y="224" class="section">Capsule 视频配方包</text>
    <text x="520" y="250" class="code">capsules/&lt;name&gt;.capsule</text>

    <rect x="514" y="278" width="118" height="34" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="534" y="300" class="codeDark">capsule.yaml</text>
    <rect x="646" y="278" width="118" height="34" rx="14" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="672" y="300" class="codeDark">contracts/</text>
    <rect x="514" y="324" width="118" height="34" rx="14" fill="#CCFBF1" stroke="#5EEAD4"/>
    <text x="540" y="346" class="codeDark">recipes/</text>
    <rect x="646" y="324" width="118" height="34" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="672" y="346" class="codeDark">quality/</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="936" y="154" width="250" height="82" rx="24" fill="#FFFFFF" stroke="#5EEAD4"/>
    <text x="970" y="190" class="section">复用下一期</text>
    <text x="970" y="214" class="tiny">换主题、换素材，保留结构和质检</text>

    <rect x="944" y="304" width="250" height="82" rx="24" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="978" y="340" class="section">迭代已有配方</text>
    <text x="978" y="364" class="tiny">把更稳的镜头、节奏、工具路线写回去</text>

    <rect x="928" y="414" width="258" height="76" rx="24" fill="#FFFFFF" stroke="#F9A8D4"/>
    <text x="962" y="448" class="section">分享给社区</text>
    <text x="962" y="472" class="tiny">先清理敏感信息，再让别人试和改</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="452" width="516" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1"/>
    <text x="416" y="482" class="label">安全边界</text>
    <text x="508" y="482" class="tiny">不保存客户资料、密钥、私有素材和成片产物。</text>
    <text x="508" y="504" class="codeDark">learning/</text>
    <text x="596" y="504" class="tiny">真实返工后的通用经验</text>
    <rect x="812" y="468" width="28" height="12" rx="6" fill="#FFEDD5"/>
    <rect x="848" y="468" width="28" height="12" rx="6" fill="#FCE7F3"/>
  </g>

  <path d="M642 412 C642 432 642 440 642 452" class="dash"/>
</svg>
