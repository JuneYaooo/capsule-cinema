    </style>
  </defs><rect width="1400" height="980" rx="34" fill="url(#bg)"/><rect width="1400" height="980" rx="34" fill="url(#grid)"/><rect width="1400" height="980" rx="34" fill="url(#glowC)"/><rect width="1400" height="980" rx="34" fill="url(#glowV)"/>
  <g class="sans">
    <g transform="translate(72 54)"><rect width="310" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="19" cy="17" r="5" fill="#65F3DE"/><text x="35" y="22" class="eyebrow" fill="#BFD2E8">CAPABILITY ROUTER · POLICY-BOUND</text></g>
    <text x="72" y="137" class="title" fill="#F7FAFF">Capabilities, not provider lock-in</text>
    <text x="74" y="171" class="subtitle" fill="#93A8C0">Recipes declare the need. Runtime matches tags, limits, credential state, and channel policy.</text>
  </g><g class="sans"><rect x="62" y="210" width="1276" height="330" rx="28" fill="#0D1524" fill-opacity=".9" stroke="#D6EAFF" stroke-opacity=".13"/>
