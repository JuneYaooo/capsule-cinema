y="27" class="label" fill="#F2F6FC">Action transfer</text><text x="42" y="47" class="small mono" fill="#6F859E">action_transfer</text></g><g transform="translate(862 870)"><rect width="288" height="62" rx="16" fill="#0B1321" stroke="#D6EAFF" stroke-opacity=".12"/><circle cx="23" cy="31" r="6" fill="#65F3DE"/><text x="42" y="27" class="label" fill="#F2F6FC">Reference-to-capsule draft</text><text x="42" y="47" class="small mono" fill="#6F859E">reference_remake</text></g></g></svg>
