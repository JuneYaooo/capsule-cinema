      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:750;letter-spacing:2.5px}
      .title{font-size:46px;font-weight:780;letter-spacing:-1.2px}
      .subtitle{font-size:18px;font-weight:450}
      .section{font-size:17px;font-weight:740}
      .label{font-size:18px;font-weight:720}
      .body{font-size:14px;font-weight:480}
      .small{font-size:12px;font-weight:620}
