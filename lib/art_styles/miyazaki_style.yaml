# 宫崎骏风格配置
style_name: "宫崎骏"
style_code: "miyazaki_style"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["天空蓝", "森林绿", "暖阳黄", "云朵白"]
    辅助色: ["柔和粉", "淡紫", "浅褐"]
    氛围特征: "清新自然，色彩饱和度高但和谐统一，水彩般柔和晕染"
  排版:
    元素布局: "自然与人文和谐统一，层次丰富"
    层次关系: "前景-中景-背景层次分明，细节精致"
  构图:
    类型: "奇幻治愈式构图"
    特征: "想象力丰富，广角展现宏大场景或特写捕捉细腻情感"
    视角: "多样化视角，富有诗意"
  特效:
    元素:
      - "流畅优美的手绘线条"
      - "水彩般的色彩晕染"
      - "自然光影效果（阳光透过云层/树叶）"
      - "手绘纸张纹理"
    质感: "手绘水彩质感，略有颗粒感，温暖细腻" 