# 末日废土动画风风格配置
style_name: "末日废土动画风"
style_code: "post_apocalyptic_anime"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["冷色调", "大地色系"]
    辅助色: ["少量暖色调（突出希望或回忆）"]
    氛围特征: "画面色调偏暗，饱和度低，阴郁但带有希望"
  排版:
    元素布局: "广角展现宏大废土景象，或特写捕捉情感"
    层次关系: "废墟场景细节丰富，光影对比强烈"
  构图:
    类型: "日系动画电影构图"
    特征: "人物比例符合日漫审美，强调情感表达"
    视角: "广角或特写，展现废土与人物情感"
  特效:
    元素:
      - "风沙效果"
      - "废墟粒子"
      - "光线穿透破损建筑"
      - "流畅细腻的线条"
    质感: "日系手绘动画质感，破败萧瑟但细腻"
