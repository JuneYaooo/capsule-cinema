# 强水墨国漫纸剧场风格配置
style_name: "强水墨国漫纸剧场"
style_code: "strong_shuimo_ink_guoman"
style_description: "主视觉为强水墨国漫、宣纸留白和分层纸剧场，不是真人古装剧，也不是弱概念国风背景图。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [黑色, 深灰色, 浅灰色, 象牙白(宣纸底色)]
    辅助色: [暗红色, 暖金色]
    氛围特征: "极简孤傲，黑灰分层墨色为主，克制使用矿物色点缀，拒绝霓虹色与高饱和度奇幻色彩。"
  排版:
    元素布局: "大面积宣纸留白，疏密有致，焦点突出。"
    层次关系: "严格遵循纸剧场层次结构，近景焦墨剪影，中景主体人物，远景淡墨晕染。"
  构图:
    类型: "传统水墨留白构图与现代纸剧场多层构图结合。"
    特征: "强调视差滚动感，避免同角度人物肖像反复复用。"
    视角: "灵活多变，仰视、平视侧面结合，强调水墨流转动态。"
  特效:
    元素:
      - "湿墨晕染"
      - "断笔边缘"
      - "枯笔纹理"
      - "墨痕转场"
      - "矿物颜料点缀"
    质感: "纯粹的2D强水墨国漫质感，宣纸底底，绝无真人古装剧质感、过度真实电影光或光泽3D感。"
