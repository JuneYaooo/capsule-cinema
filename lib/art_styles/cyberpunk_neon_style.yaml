# 赛博朋克霓虹风格风格配置
style_name: "赛博朋克霓虹风格"
style_code: "cyberpunk_neon_style"
style_description: "充满未来感的高清赛博朋克霓虹风格，强调蓝紫光影对比和人物的高清质感，适合动作迁移的全身人物生成。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [蓝紫色, 霓虹粉, 深邃黑]
    辅助色: [荧光青, 银灰色]
    氛围特征: "强烈的霓虹冷暖光对比，未来科技感十足的夜景氛围"
  排版:
    元素布局: "人物绝对居中的极简结构，背景为丰富的霓虹街景留白"
    层次关系: "前景清晰锐利的人物主体，背景带有适度景深模糊的霓虹发光体"
  构图:
    类型: "9:16竖屏全身对称/居中构图"
    特征: "极度强调主体全身完整无遮挡，边缘清晰，脚部不可裁剪"
    视角: "平视，聚焦于真实人体比例"
  特效:
    元素:
      - "霓虹光晕"
      - "轻微的赛博朋克光影"
      - "高质量的衣料反射光"
    质感: "超高清、高对比度的未来科技质感，强调真实服饰材质"
