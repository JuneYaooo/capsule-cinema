# 数字插画风格配置
style_name: "数字插画"
style_code: "digital_illustration"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["暖米黄", "柔和橙", "淡雅绿"]
    辅助色: ["浅褐", "灰蓝", "奶白"]
    氛围特征: "暖色调低饱和度，营造怀旧和逝去时光的感觉"
  排版:
    元素布局: "历史剧构图，人物与环境融合"
    层次关系: "前景（人物）- 中景（道具/建筑）- 背景（自然环境），层次柔和过渡"
  构图:
    类型: "故事书式构图"
    特征: "画面平衡和谐，富有历史剧感，细节精致但不过分突出"
    视角: "中景或全景，展现历史场景氛围"
  特效:
    元素:
      - "绘画般的笔触质感"
      - "柔和的光影过渡"
      - "历史感氛围渲染"
    质感: "柔和绘画质感，边缘略带晕染效果" 