# 浓郁电影感国风配置
style_name: "浓郁电影感国风"
style_code: "rich_cinematic_chinese_style"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["深邃蓝黑", "浓郁正红", "纯净白"]
    辅助色: ["青蓝", "暗紫", "金/黄点缀"]
    氛围特征: "高对比度、浓郁国风配色，冷色调背景与暖色调元素形成冲突感"
  排版:
    元素布局: "主体人物居中占比大，背景元素环绕式填充"
    层次关系: "前景（人物）- 中景（飘带/神兽）- 背景（云雾纹理），信息层级清晰"
  构图:
    类型: "重垂直式人物群像构图"
    特征: "人物呈前后错落排列，动态线条（飘带）引导视觉流向，背景元素呼应主体风格"
    视角: "平视略偏侧的人物视角"
  特效:
    元素:
      - "流动式云雾纹理"
      - "飘逸的红色飘带（水墨笔触质感）"
      - "神兽装饰性纹样"
    质感: "水墨渲染+扁平插画结合，边缘柔和但色彩饱和度高"