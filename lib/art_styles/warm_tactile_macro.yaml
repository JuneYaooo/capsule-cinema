# 暖调微距触感风格配置
style_name: "暖调微距触感"
style_code: "warm_tactile_macro"
style_description: "极其注重物理真实触感与光影温度的微距治愈ASMR风格，适用于宠物、食物的治愈系慢镜头特写"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [温暖中性色, 午后阳光的暖黄, 自然木色]
    辅助色: [柔和白, 橘黄色系]
    氛围特征: "宁静、温暖、治愈，色彩自然不夸张且富有真实生活感"
  排版:
    元素布局: "中心清晰对焦，去除无关背景杂物，主体稳居视觉中心"
    层次关系: "极浅景深，焦点锁定在微小动作与接触面上，背景完全柔化虚化"
  构图:
    类型: "竖屏微距/中近景特写"
    特征: "极其靠近主体，放大微小细节，构图极简纯粹"
    视角: "平视或微俯视的专注观察者视角"
  特效:
    元素:
      - "清晰真实的毛发纹理"
      - "食物表面的自然光泽与酥脆感"
      - "细腻的光斑与阴影"
    质感: "超写实物理质感，视觉能引发ASMR触觉联想"
