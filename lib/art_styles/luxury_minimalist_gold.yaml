# 黑金极简轻奢风格配置
style_name: "黑金极简轻奢"
style_code: "luxury_minimalist_gold"
style_description: "极简的高对比度深色空间，结合纯正的金色作为唯一核心点缀色，绝对的中心对焦构图，适合高级知识科普"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [纯净深黑, 深灰色]
    辅助色: [纯正金色 (Gold accent)]
    氛围特征: "极高对比度的光影质感，专业、极简且充满高级工业设计感"
  排版:
    元素布局: "画面绝对干净，没有任何多余的杂乱点缀和繁复叠加，无emoji徽章，文字排版简洁"
    层次关系: "中心主体绝对突出，背景留黑"
  构图:
    类型: "绝对的中心对焦构图，完全对称"
    特征: "核心元素居中且清晰，利用纯粹的强光影对比突出主体"
    视角: "正面平视或微距特写"
  特效:
    元素:
      - "细腻的高光"
      - "金色能量光点"
      - "金属质感"
      - "明暗呼吸感光影"
    质感: "工艺精湛的高级工业设计质感，流动感极强且熠熠生辉的金属材质"
