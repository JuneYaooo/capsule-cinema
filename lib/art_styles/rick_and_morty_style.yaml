# Rick and Morty动画风格配置
style_name: "Rick and Morty动画"
style_code: "rick_and_morty_style"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["高饱和度色彩"]
    辅助色: ["对比强烈的配色（红黑撞色、绿蓝对比等）"]
    氛围特征: "色块平涂，强烈视觉冲击"
  排版:
    元素布局: "背景简化，色块分明，几何化处理"
    层次关系: "角色与背景统一视觉风格"
  构图:
    类型: "美式动画构图"
    特征: "正面特写、对称构图或戏剧化视角"
    视角: "强化角色气场和情绪表达"
  特效:
    元素:
      - "粗犷有力的黑色描边"
      - "夸张卡通化比例"
      - "简化但辨识度高的五官"
    质感: "美式动画质感，线条简洁富有表现力"
