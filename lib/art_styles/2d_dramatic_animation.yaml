# 2D戏剧反转动画风格配置
style_name: "2D戏剧反转动画"
style_code: "2d_dramatic_animation"
style_description: "2D动画风格，要求包含暖色调开场、高饱和度美食特写中段以及惊悚打光结尾的强烈戏剧性情绪反转。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [暖黄色, 高饱和亮色, 纯黑色]
    辅助色: [金黄色, 鲜亮红棕, 惨白色]
    氛围特征: "极强的情绪色彩对比：由温馨柔和的暖黄开场，无缝衔接至高饱和、高光泽感的美食色调，结尾瞬间骤变为深邃纯黑背景配以惨白高光的惊悚氛围。"
  排版:
    元素布局: "主体居中，随节奏变化由宽舒走向紧凑压迫"
    层次关系: "前半段人景交融，中段去背景化突出美食细节，结尾完全剥离背景仅聚焦极度夸张的主体面部"
  构图:
    类型: "情绪递进式构图"
    特征: "开场常规中近景对话铺垫；中段采用微距极度贴近美食；结尾使用极度夸张的面部特写，填满画面"
    视角: "平稳的客观平视逐渐转变为带有强烈压迫感的微仰视"
  特效:
    元素:
      - "温馨丁达尔光晕"
      - "滋滋冒泡的汁水飞溅"
      - "袅袅升腾的热气"
      - "戏剧性惨白顶光"
      - "夸张的面部阴影形变"
    质感: "高品质2D动画作画质感，前期柔和治愈，中段具备极致的食欲光泽感，结尾线条锐利硬朗，呈现惊悚动漫张力"
