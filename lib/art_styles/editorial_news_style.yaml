# 科技新闻社论风格风格配置
style_name: "科技新闻社论风格"
style_code: "editorial_news_style"
style_description: "面向AI科技新闻的专业社论摄影风格。强调真实质感、暗黑背景与极简布局，杜绝赛博朋克和过度科幻的光效，为后期数据展示留白。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [深黑色, 炭灰色, 冷静灰]
    辅助色: [克制金色, 纯白色, 银色]
    氛围特征: "专业冷静、商务高端、写实且具有新闻质感"
  排版:
    元素布局: "社论式排版，画面布局整洁，包含大量留白区域以承载后期叠加的数字和文本"
    层次关系: "明确的前中后景深，焦点集中在核心科技元素上"
  构图:
    类型: "商业摄影构图"
    特征: "简约、对称或对角线构图，模仿科技产品发布会和Keynote的镜头感"
    视角: "客观的中景或特写视角，强调真实细节"
  特效:
    元素:
      - "真实环境光影"
      - "物理材质质感（金属、玻璃、皮肤）"
      - "微弱的指示灯点缀"
    质感: "照片级真实感，质感锐利，无霓虹、无全息、无代码雨"
