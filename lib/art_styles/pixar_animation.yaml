# 皮克斯风格配置
style_name: "皮克斯"
style_code: "pixar_animation"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: ["明亮暖色", "鲜艳但不刺眼的饱和色"]
    辅助色: ["互补色", "对比色用于主体突出"]
    氛围特征: "大胆鲜艳，色彩过渡柔和自然，温暖舒适"
  排版:
    元素布局: "清晰专业，主体突出，层次分明"
    层次关系: "景深控制精准，前景-中景-背景层次丰富"
  构图:
    类型: "电影级构图"
    特征: "广角或特写增强叙事性，构图专业清晰"
    视角: "富有电影感的镜头语言"
  特效:
    元素:
      - "三点布光系统"
      - "环境光遮蔽(AO)"
      - "全局光照(GI)"
      - "柔和阴影和高光"
    质感: "表面光滑细腻，材质感极强，次表面散射效果明显"