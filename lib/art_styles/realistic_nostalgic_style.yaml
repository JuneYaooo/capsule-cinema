# 写实怀旧风格配置
style_name: "写实怀旧"
style_code: "realistic_nostalgic_style"
style_description: "写实怀旧风格，结合照片级真实感与复古胶片怀旧美学。画面具有浓郁的暖黄色调和胶片颗粒感，色彩饱和度略低，呈现出老照片般的温暖质感。适合拟人化萌宠短剧、怀旧叙事类内容。"

# 视频视觉风格 - 结构化配置（用于图生视频，控制视觉风格）
visual_style:
  颜色:
    主色调: [暖黄色, 琥珀色, 柔和的褐色]
    辅助色: [复古金色, 淡米色, 暗橘色, 旧象牙白]
    氛围特征: "浓郁的怀旧暖黄色调，色彩饱和度略微降低，整体偏暖偏黄，如同泛黄的老照片或复古胶片电影的色彩还原，光影柔和温暖"
  排版:
    元素布局: "符合现实物理规律，透视准确，人物与环境融合自然，注重场景的生活化细节"
    层次关系: "景深自然柔和，前景清晰-中景主体突出-背景略带柔焦的虚化效果，营造温暖的空间纵深感"
  构图:
    类型: "写实叙事构图"
    特征: "比例协调，细节丰富，注重人物表情和肢体语言的捕捉，场景布置充满生活化的怀旧细节"
    视角: "符合现实视角，以平视和略微仰视为主，偶尔使用跟随镜头增强代入感"
  特效:
    元素:
      - "胶片颗粒感"
      - "暖黄色光晕"
      - "柔和的镜头光斑"
      - "轻微的暗角效果"
      - "真实自然的光影"
    质感: "照片级真实感与复古胶片质感的融合，材质纹理清晰逼真，皮毛、织物等细节丰富，整体画面带有温暖的旧时光滤镜效果"
