# Video engine catalog — single source of truth for engine keys, aliases, models
# and provider limits. Read through lib/src/video_engines.py; tools must not
# hard-code these numbers. Tool class ↔ engine binding lives in
# tool_registry.yaml (runtime_engine).
#
# Seedance numbers follow the official Ark "创建视频生成任务" API reference
# (https://ark.volcengine.com/region:cn-beijing/docs/create-video-generation-task-api),
# checked 2026-11-15.
engines:
  seedance2.0:
    name: Doubao Seedance 2.0 (Volcengine Ark official)
    provider: volcengine_ark
    default_model: doubao-seedance-2-0-260128
    model_env: [ARK_SEEDANCE_MODEL, ARK_SEEDANCE20_MODEL]
    aliases: [seedance-2.0, seedance20, seedance_2_0, seedance-2]
    prompt_language: zh
    status: approved
    capabilities:
      duration_range: [4, 15]
      automatic_duration: -1
      default_duration: 5
      aspect_ratios: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "adaptive"]
      resolutions: [480p, 720p, 1080p, 4k]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
      reference_video_seconds: [2, 15]
      max_reference_video_total_seconds: 15
      reference_audio_seconds: [2, 15]
      max_reference_audio_total_seconds: 15
      audio_only_reference: false
      frame_modes_require_adaptive_ratio: false
      default_max_wait_seconds: 900
    features:
      text_to_video: true
      image_to_video: true
      first_last_frame: true
      multimodal_reference: true
      native_audio: true
      return_last_frame: true
    best_for: [电商展示, 写实商品, 强动作, 短剧情]
    strengths: [官方 Ark 任务接口, 中文提示词, 首尾帧, 多模态参考, 原生有声视频]
    weaknesses: [账号需开通 Seedance 2.0, 不支持 seed 和 camera_fixed, 视频结果 URL 仅保留 24 小时]
    cost_tier: high
  seedance2.5:
    name: Doubao Seedance 2.5 (Volcengine Ark official)
    provider: volcengine_ark
    default_model: doubao-seedance-2-5-260628
    model_env: [ARK_SEEDANCE25_MODEL]
    aliases: [seedance-2.5, seedance25, seedance_2_5]
    prompt_language: zh
    status: approved
    capabilities:
      duration_range: [4, 30]
      automatic_duration: -1
      default_duration: 5
      aspect_ratios: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "adaptive"]
      resolutions: [480p, 720p, 1080p, 4k]
      max_reference_images: 30
      max_reference_videos: 10
      max_reference_audios: 10
      reference_video_seconds: [2, 30]
      max_reference_video_total_seconds: 30
      reference_audio_seconds: [2, 30]
      max_reference_audio_total_seconds: 30
      audio_only_reference: true
      # 2.5 first-frame / first-last-frame tasks only accept ratio=adaptive.
      frame_modes_require_adaptive_ratio: true
      default_max_wait_seconds: 1800
    features:
      text_to_video: true
      image_to_video: true
      first_last_frame: true
      multimodal_reference: true
      multi_shot: true
      native_audio: true
      return_last_frame: true
    best_for: [参考原片改写, 一次多镜头, 长单元 30 秒, 电商展示]
    strengths: [单次 30 秒, 30 图 10 视频 10 音频参考, 原生有声视频]
    weaknesses: [账号需开通 Seedance 2.5, 参考视频只能传 URL 或 asset://, 1080p/4K 输出为 10-bit H.265]
    cost_tier: high
  minimax-h3:
    name: MiniMax H3 / Hailuo-03 (official V2)
    provider: minimax_official
    default_model: MiniMax-H3
    aliases: [minimax_h3, minimaxh3, MiniMax-H3, hailuo-03]
    prompt_language: zh
    status: approved
    capabilities:
      duration_range: [4, 15]
      default_duration: 5
      aspect_ratios: ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      resolutions: [2K]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
      default_max_wait_seconds: 900
    features:
      text_to_video: true
      image_to_video: true
      first_last_frame: true
      multimodal_reference: true
      native_audio: true
      return_last_frame: false
    best_for: [显式高分辨率, 2K直出, 首尾帧, 多模态参考, 电影感画面]
    strengths: [官方 V2 任务接口, 2K直出, 多模态参考, 首尾帧]
    weaknesses: [只支持2K不适合低成本预览, 文生视频必须指定具体画幅, 结果下载链接有时效]
    cost_tier: high
selection_rules:
  default: seedance2.0
  high_resolution_explicit: minimax-h3
  # Engines that capsules may pick automatically. seedance2.5 is explicit-only:
  # callers (e.g. rea-video) must name it; it never appears as a silent fallback.
  supported: [seedance2.0, minimax-h3]
  explicit_only: [seedance2.5]
compatibility:
  pure_image_to_video: [seedance2.0, minimax-h3]
  pure_text_to_video: [seedance2.0, minimax-h3]
