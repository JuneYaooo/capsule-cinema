engines:
  seedance2.0:
    name: Doubao Seedance 2.0 (Volcengine Ark official)
    provider: volcengine_ark
    default_model: doubao-seedance-2-0-260128
    status: approved
    capabilities:
      duration_range: [4, 15]
      automatic_duration: -1
      default_duration: 5
      aspect_ratios: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "adaptive"]
      resolutions: [480p, 720p, 1080p, 4k]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
    features:
      text_to_video: true
      image_to_video: true
      first_last_frame: true
      multimodal_reference: true
      native_audio: true
      return_last_frame: true
    best_for: [电商展示, 写实商品, 强动作, 短剧情]
    strengths: [官方 Ark 任务接口, 中文提示词, 首尾帧, 多模态参考, 原生有声视频]
    weaknesses: [账号需开通 Seedance 2.0, 不支持 seed 和 camera_fixed, 视频结果 URL 仅保留 24 小时]
    cost_tier: high
  minimax-h3:
    name: MiniMax H3 / Hailuo-03 (official V2)
    provider: minimax_official
    default_model: MiniMax-H3
    status: approved
    capabilities:
      duration_range: [4, 15]
      default_duration: 5
      aspect_ratios: ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      resolutions: [2K]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
    features:
      text_to_video: true
      image_to_video: true
      first_last_frame: true
      multimodal_reference: true
      native_audio: true
      return_last_frame: false
    best_for: [显式高分辨率, 2K直出, 首尾帧, 多模态参考, 电影感画面]
    strengths: [官方 V2 任务接口, 2K直出, 多模态参考, 首尾帧]
    weaknesses: [只支持2K不适合低成本预览, 文生视频必须指定具体画幅, 结果下载链接有时效]
    cost_tier: high
selection_rules:
  default: seedance2.0
  high_resolution_explicit: minimax-h3
  supported: [seedance2.0, minimax-h3]
compatibility:
  pure_image_to_video: [seedance2.0, minimax-h3]
  pure_text_to_video: [seedance2.0, minimax-h3]
