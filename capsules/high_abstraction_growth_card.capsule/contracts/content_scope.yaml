schema_version: capsule.content_scope.v1
series_fixed:
  - card_visual_system
  - cognitive_reframe_voice
  - escalating_question_structure
  - bold_keyword_protocol
  - card_form_family
  - vector_component_family
  - persistent_character_anchor
  - header_footer_branding
  - tts_bgm_route
episode_variable:
  - topic
  - content_lane
  - duration_mode
  - audience_pressure
  - angle_candidates
  - selected_angle
  - concrete_scenes
  - proof_route
  - derived_actions
  - identity_payoff
  - beats
  - retention_questions
  - information_gain_map
  - emphasis_keywords
  - card_forms
  - cards
  - voiceover_text
  - title
  - cover_text
  - publishing_copy
forbidden_reusable_literals:
  - 拖延
  - 启动成本设计
  - 你不是没有行动力
  - 先做哪 90 秒
  - 九十秒
  - 把第一步改小
policies:
  allow_series_fixed_defaults: true
  forbid_episode_specific_defaults: true
  active_recipe_examples_must_use_placeholders: true
  current_run_input_may_reuse_literal: true
  fixed_visual_skin_must_not_imply_fixed_episode_logic: true
  topic_lane_must_be_selected_before_script: true
  evidence_strength_must_be_preserved: true
evidence_boundary:
  account_baseline_unique_posts: 60
  full_text_opening_visual_samples: 20
  high_performance_samples: 15
  recent_comparison_samples: 5
  opening_and_representative_frames: 340
  comment_samples: 382
  evidence_level: L4_video_opening
  bounded_layers:
    - full_timeline_action_continuity
    - full_timeline_bgm_and_sfx_model_review
  policy: Reuse the evidenced cognitive-reframe structure, topic-selection signals, opening grammar, comment demand, and visual system as generalized mechanisms; never turn account correlation into a universal causal law or copy source identity and wording.
