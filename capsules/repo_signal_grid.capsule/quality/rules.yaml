rules:
- category: topic_selection
  id: repo_topic_selection_scorecard_required
  rule: 生成标题前必须完成六维选题评分卡：task_specificity、hard_detail、result_proof、forward_receiver、open_judgment、fact_safety，每项 0-2 分。9-12 分可优先制作，7-8 分先补证据或收窄角度，0-6 分换项目或换角度；fact_safety=0 时不得进入 approved release。
  type: planning_review
- category: topic_selection
  id: repo_primary_topic_formula_required
  rule: 每条 repo/tool/Skill 内容只选择一个主公式：hidden_resource、result_proof、tested_comparison、cognitive_reversal、risk_warning、workflow_bundle；必要时最多再选一个副公式。不得把人物冲突、道德反噬或身份站队硬套到普通仓库。
  type: planning_review
- category: topic_selection
  id: repo_topic_hard_detail_and_receiver_required
  rule: 进入标题生成前必须写清 target_user、specific_task、hard_detail、evidence_source、forward_receiver、open_judgment 和 risk_boundary。只有 stars、Skill 数量、开源身份或宽泛效率承诺不能作为选题。
  type: copy_review
- category: hook
  id: hook_candidate_formula_records_required
  rule: 至少 12 个标题候选必须围绕已选主公式生成；每个候选记录 topic_formula、target_user、specific_task、hard_detail、evidence_source、forward_receiver、open_question、risk_boundary，并按主体前置、任务具体、硬细节、可见证据、熟人转发、判断缺口、首屏可证明和事实安全评分。
  type: copy_review
- category: copy
  id: judgment_evidence_gap_arc_required
  rule: 文案必须按“用户判断或任务身份 -> 项目动作与硬证据 -> 使用结果、边界或未闭合问题”推进；4-5 页共同完成判断链，每页只推进一个主要判断，同时保留每页 4-5 行完整事实链的现有合同。
  type: copy_review
- category: quality_gate
  id: repo_six_quality_gates_required
  rule: approved release 必须同时通过证据门、人类收益门、认知负荷门、传播对象门、互动质量门和合规门；评论主要来自对夸张标题或错误事实的嘲讽时，不能当作高质量互动，必须重写。
  type: content_review
- category: content
  id: value_card_completed
  rule: 必须先完成目标用户、痛点敌人、项目结果、独特机制、证据素材、边界提醒
  type: copy_review
- category: hook
  id: first_screen_user_value
  rule: 首屏必须先写用户结果，不得只写开源/GitHub/AI 工具身份
  type: copy_review
- category: hook
  id: unique_value_visible
  rule: 首屏必须出现目标项目最独特价值，例如模板克隆、结构化输出、本地可控或真实产物质量
  type: copy_review
- category: copy
  id: no_production_jargon
  rule: 画面中不得出现 HOOK、卖点、痛点 等制作术语
  type: copy_review
- category: final_video
  expected_aspect_ratio: '6:7'
  expected_height: 1260
  expected_width: 1080
  id: six_by_seven_format
  type: video_quality
- category: visual_copy
  id: readable_frame_margin_with_platform_safe_space
  rule: 6:7 默认版式固定为 1080×1260：标题、素材、事实链、脚注或其他关键信息必须位于 y=30..1230；暖白底、橙色网格和光晕必须覆盖完整 y=0..1260，不得把顶部和底部画成纯白空带或不同颜色的分区。
  type: layout_review
- category: visual
  id: centered_balance
  rule: 上方标题、中间素材、下方卡片必须居中均衡，不能整体偏左
  type: layout_review
- category: source_material
  id: material_integrity
  rule: 仓库 demo 图尽量完整展示，不裁到看不懂
  type: visual_review
- category: source_material
  id: real_evidence_first
  rule: 优先使用真实 demo/产物/截图；AI 概念图不能替代项目证据
  type: visual_review
- category: qa_report
  id: qa_report_required
  type: artifact_required
- category: publishing_package
  id: publishing_package_required
  rule: 每条成片必须产出 publishing_package_v1.md，并写入 artifact_manifest.json
  type: artifact_required
- category: publishing_package
  id: publishing_package_complete
  rule: 发布包必须包含推荐标题、标题备选、封面文字、正文、短正文、标签、置顶评论、评论区引导和发布提醒
  type: copy_review
- category: publishing_package
  id: publishing_risk_boundary
  rule: 高风险领域发布正文和置顶评论必须保留边界提醒，不得写成可替代专业决策
  type: copy_review
- category: visual
  id: fixed_top_title_consistency
  rule: 全片顶部标题必须保持一致，作为贯穿始终的核心钩子；底部文案才随画面变化
  type: layout_review
- category: identity
  id: project_identity_badge_required
  rule: 顶部身份徽标必须准确显示当前主体：单仓库用 `owner/repo`，单个 Skill 用短 Skill path；不得只用 REPO SHOWCASE、GitHub 项目、AI 工具等泛标签。`owner/repo` 和仓库内短路径可以上屏，完整 URL、域名、二维码、扫码和链接引导禁止上屏。
  type: layout_review
- category: identity
  id: multi_skill_subject_list_when_needed
  rule: 默认每条视频只讲一个 repo、Skill 或工具；如果确实覆盖多个 Skills/modules/tools，必须使用专门 subject_paths 或同等主体列表区域展示 3-5 个代表短路径，不得塞进标题、中间素材或底部文案里造成拥挤。
  type: layout_review
- category: visual_copy
  id: top_subtitle_readability_and_spacing
  rule: 6:7 顶部副标题/身份行必须让具体 owner/repo 或短 Skill path 可读，默认约 32-36px、推荐 34px；身份徽标从 y=25 开始，标题和副标题必须在中间素材区约 y=270 之前结束。首帧或 contact sheet QA 必须确认三者有清晰间距，不能相互压住或重叠。
  type: layout_review
- category: publishing_package
  id: title_cover_publish_alignment
  rule: 发布推荐标题、封面文字和片内固定顶部标题应使用同一个核心钩子或同义表达
  type: copy_review
- category: platform_copy_directory
  id: platform_copy_directory_required
  rule: 必须生成 publish/ 目录，包含视频号、小红书、快手、B站、抖音独立文案文件和 platform_copy_manifest.json
  type: artifact_required
- category: platform_copy_directory
  id: platform_copy_adapted
  rule: 每个平台文案必须按平台语气、标题结构、正文长度、标签格式和互动方式适配，不能只复制同一份文案换标签
  type: copy_review
- category: hook
  id: hook_candidate_bakeoff_required
  rule: 生成脚本前必须产出至少 12 个标题候选，并按任务具体度、可见结果、证据密度、反差、收藏价值、风险控制打分。
  type: copy_review
- category: hook
  id: top_title_must_be_hook_not_category
  rule: 固定顶部标题不得只写 GitHub/开源/AI工具/项目推荐，必须包含用户结果、痛点反差、证据数字或独特机制。
  type: copy_review
- category: opening
  id: proof_in_first_3s_for_tool_accounts
  rule: 0-3 秒必须出现结果、GitHub/README证据、真实UI、前后对比、失败画面或具体证据数字之一。
  type: visual_review
- category: hook
  id: title_visual_proof_alignment
  rule: 推荐标题、封面标题和首屏标题必须能被首屏或前 8 秒画面证明，不能只靠口播承诺。
  type: content_review
- category: risk
  id: risky_domain_boundary_as_hook
  rule: 医疗、金融、法律、安全相邻项目必须用边界钩子收口：说明真实安全用途，避免诊断、投资、法律结论、攻击等高风险承诺。
  type: copy_review
- category: hook
  id: core_subject_in_title_required
  rule: 首屏固定标题必须明确核心对象，例如课程、仓库、工具或资料类型；不能只写截图数、星标数或抽象收益。
  type: copy_review
- category: hook
  id: core_transformation_in_title_required
  rule: 首屏固定标题必须明确核心转化，例如蒸馏成 Skill、整理成知识库、生成可交付文件、部署成服务。
  type: copy_review
- category: hook
  id: proof_cannot_replace_subject
  rule: 截图数量、星标、案例、成本等 proof 只能作为副标题或补强，不得替代核心对象和核心转化。
  type: copy_review
- category: hook
  id: self_media_memory_anchor_audit_required
  rule: 生成脚本前必须产出传播资产审计：强 proof 数字、名字/IP隐喻、视觉符号、反差、观众复述句。
  type: copy_review
- category: hook
  id: strong_proof_fronted_when_high_signal
  rule: 当 stars、截图数、成本、速度等 proof 是强信任钩子时，必须评估是否前置到封面/首屏/开头画面/平台文案；不得默认放到最后。
  type: copy_review
- category: hook
  id: proof_fronted_but_bound_to_promise
  rule: 前置 proof 数字必须绑定核心对象、名字/IP或核心转化；不能只写数字导致观众不知道项目把什么变成了什么。
  type: copy_review
- category: hook
  id: ip_metaphor_not_metadata
  rule: 项目名、人名、IP、隐喻、README hero 图和口号必须作为候选记忆锚评估，不得只当 metadata。
  type: copy_review
- category: hook
  id: audience_recall_sentence_required
  rule: 必须写出一句观众可转述的话；如果这句话不顺口、不具体或没有画面感，主钩子重写。
  type: copy_review
- category: hook
  id: non_replaceable_hook_required
  rule: 主钩子必须通过不可替换测试：换成另一个 repo/项目名后仍成立，则说明太泛，必须重写。
  type: copy_review
- category: copy
  id: public_copy_no_strategy_jargon
  rule: 公开视频、字幕、卡片、封面和平台正文不得出现“前置、信任钩子、记忆点、传播资产、策略”等制作/策划术语；必须翻译成观众语言。
  type: copy_review
- category: copy
  id: visible_copy_strategy_term_scan_required
  rule: 最终渲染前必须扫描 SCENES/voiceover/cover/platform copy 的可见文本，确认没有内部策略词残留。
  type: copy_review
- category: copy
  id: visible_copy_lint_tool_required
  rule: 交付前必须运行 visible_copy_lint.py 扫描公开视频/字幕/卡片/封面/发布正文；命中内部策略词则阻断交付。
  type: copy_review
- category: artifact_landing
  id: standard_release_package_required
  rule: 通过 QA 的最终版本必须整理到 output/<project>/release/<version_slug>/，包含 public、qa、technical、internal
    四类目录。
  type: artifact_required
- category: artifact_landing
  id: current_release_pointer_required
  rule: 项目根目录必须有 CURRENT_RELEASE.md，明确当前可用版本和不要使用的旧版本。
  type: artifact_required
- category: artifact_landing
  id: public_internal_separation_required
  rule: public/ 只放可发布资产；internal/ 放策略、hook bakeoff、storyboard、value card，不允许混放。
  type: artifact_review
- category: artifact_landing
  id: release_manifest_required
  rule: release/<version_slug>/release_manifest.json 必须记录 final_video、cover、publishing_package、qa_report、lint_report、source_url、supersedes。
  type: artifact_required
- category: audience
  id: audience_pull_card_required
  rule: 严肃成片必须产出 audience_pull_card，说明谁会关注、为什么停下、为什么在意、能带走什么、谁不是目标用户。
  type: artifact_required
- category: audience
  id: primary_audience_named_required
  rule: 主钩子确定前必须明确 1-3 个主要目标用户，不能用“所有人/大众/AI用户”这类泛称替代。
  type: copy_review
- category: audience
  id: viewer_job_to_be_done_required
  rule: 必须写清观众看完能做什么、理解什么或收藏什么；不能只讲项目功能。
  type: copy_review
- category: audience
  id: non_target_user_boundary_required
  rule: 必须说明非目标用户和不能吸引的错误期待，尤其角色扮演、保证效果或高风险决策。
  type: copy_review
- category: audience
  id: user_first_brief_required
  rule: 脚本前必须完成 user-first brief：primary_user、user_language、current_alternative、attention_trigger、use_reason、actionable_takeaway、wrong_audience。
  type: copy_review
- category: audience
  id: public_lines_defensible_from_user_view
  rule: 每条公开视频/封面/发布正文的核心句，都必须能从 primary_user 的“为什么我会在意”解释；否则重写。
  type: copy_review
- category: audience
  id: no_builder_perspective_only
  rule: 不得只从项目作者、工具介绍者、Agent 策划者视角输出；必须把项目能力翻译成目标用户的任务、收益或张力。
  type: copy_review
- category: audience
  id: current_alternative_required
  rule: 必须说明目标用户不用该项目时的现有替代做法，才能证明视频为什么值得看。
  type: copy_review
- category: visual
  id: dark_gradient_grid_background
  rule: 成片必须使用白色纸张 + 橙色网格视觉系统：#FFFDF8 暖白背景和安全区、低透明橙色网格与桃色光晕、#FFFFFF 截图卡、#FFF1E5 底部事实卡、#F2D5C2 叠层阴影、#2B1A12 顶部标题、#806252 副标题、#493228 正文、#F26B2B 默认强调色；不得回退成原版蓝黑 cyan 配色或上一版深石墨配色。审片
    contact sheet 不符合则不能记为成功。
  type: visual_review
- category: visual_copy
  id: large_text_user_value_first
  rule: 最大字号必须优先表达目标用户的痛点、转化或结果；项目名、截图、星标、命令和证据标签只能做支撑。
  type: copy_review
- category: qa
  id: visible_text_lint_required
  rule: 成片前检查实际上屏文字，不能出现版本、修正、source、real asset 等制作/交付词。
  type: copy_review
- category: route
  id: default_route_short_silent
  rule: repo_signal_grid 固定走 short_silent_repo_signal_grid：无口播、不烧字幕、4-5页、总时长固定15秒；默认静音，只有用户提供并确认授权的本地 BGM 才能加入。
  type: planning_review
- category: route
  id: mode_scoped_quality_rules
  rule: 质量规则只按 short_silent_repo_signal_grid 生效；不得启用 TTS、字幕或配音同步检查。
  type: planning_review
- category: audio
  id: silent_mode_no_tts_without_request
  rule: short_silent_repo_signal_grid 不生成口播、不烧字幕；不得启用 TTS 或字幕。
  type: audio_quality
- category: final_video
  expect_audio: false
  expected_duration_min: 15
  expected_duration_max: 15
  expected_duration_min: 9.8
  id: silent_mode_duration_and_optional_bgm
  rule: 默认成片固定 15 秒且无口播；没有已授权本地 BGM 时允许静音交付。重跑脚本、profile 或 batch 配置不得覆盖成其他时长，也不得自动调用 TTS、AI 音乐或远程媒体生成工具。
  type: video_quality
- category: visual_copy
  id: short_silent_layout_density
  rule: 默认 short_silent_repo_signal_grid 使用固定顶部标题、中间真实截图/证据图、下方 4-5 行事实链文案；每张底部卡整体必须连接目标用户关心的痛点、收益、机制、证据或边界，不按固定行位验收。
  type: layout_review
- category: source_material
  id: first_version_real_source_middle_visuals
  rule: repo_signal_grid 中间主视觉必须先做真实浏览器来源审计：第一帧优先使用实际打开 GitHub 后的 README/仓库关键区域截图，截图到 README 内容、stars、项目说明或关键区域；后续按 1/4/3/2 优先级使用实际浏览器中的
    GitHub/README 页面、README 可见图片元素、X 搜索/公开讨论、外部项目 docs/demo/release 页面。approved 成片至少 4 页必须来自 actual_browser_* capture_method；仓库图片、下载的
    README/docs 内嵌图、demo/UI/产物截图、GIF/视频抽帧只能作为 diagnostic/compat 记录。找不到真实浏览器截图就跳过，不用本地重排卡、下载图、抽帧或文件列表凑成片。
  type: visual_review
- category: source_material
  id: rich_middle_visuals_required
  rule: approved repo_signal_grid 必须有至少 4 个 browser-captured rich middle visual：browser_evidence_screenshot、readme_embedded_image、project_discussion_image、external_project_related_image，且每个 scene
    对应 asset 的 capture_method 必须以 actual_browser_ 开头。browser_evidence_screenshot 必须是实际浏览器打开 GitHub/官方页面后的 README/仓库关键区域截图；documentation_screenshot
    只能进入 blocked 或 diagnostic；source_file_screenshot 只能进入 blocked 或 diagnostic；repository_image、demo_output_screenshot、video_or_gif_frame 只能进入 diagnostic/compat，不能进入 approved release。找不到真实浏览器素材就跳过。
  type: release_gate
- category: source_material
  id: approved_middle_visual_positive_contract
  rule: approved repo_signal_grid 的中间主视觉只有一条正向路径：每张图都必须映射到 source_asset_manifest，且对应 asset
    有本地 path、actual_browser_* capture_method、source_url_or_repo_path、actual_source=true、reconstructed_card=false。
  type: visual_review
- category: source_material
  id: allowed_source_asset_types_required
  rule: source_asset_manifest 可以记录 browser_evidence_screenshot、repository_image、readme_embedded_image、project_discussion_image、external_project_related_image、documentation_screenshot、source_file_screenshot、demo_output_screenshot、video_or_gif_frame
    等来源；approved middle visual 只接受以 actual_browser_ 采集的 browser_evidence_screenshot、readme_embedded_image、project_discussion_image、external_project_related_image。repository_image、demo_output_screenshot、video_or_gif_frame
    以及 documentation_screenshot、source_file_screenshot 均只能标记为 blocked/diagnostic/compat。素材类型不清楚时先降级为 source_file_screenshot 或 documentation_screenshot 并写清 capture_method，同时标记为 blocked/diagnostic。
  type: visual_review
- category: source_material
  id: real_source_fallback_order_required
  rule: 缺少浏览器可截图素材时先补真实浏览器 README/仓库关键区域截图作为 browser_evidence_screenshot；第二优先截 README 可见图片元素；第三优先 X 搜索/公开讨论浏览器截图；第四优先外部项目
    docs/demo/release 页面浏览器截图。它必须能看出 README 内容、stars、项目说明、项目结果、docs 重点或其他 primary-source 关键区域。普通 documentation_screenshot、source/example/config 文件截图、带
    README 或源码摘录的仓库树截图、下载/复制仓库图只能解释为什么 skipped_missing_material。
  type: visual_review
- category: source_material
  id: approved_release_browser_screenshot_only
  rule: approved release 的 4 个中间主视觉必须全部是实际浏览器截图，capture_method 只能使用 actual_browser_github_repository_page_screenshot、actual_browser_github_repo_readme_key_area_screenshot、actual_browser_github_readme_image_element_screenshot、actual_browser_x_search_screenshot、actual_browser_project_page_screenshot。
    `REPO_SHOWCASE_REQUIRE_BROWSER_SCREENSHOTS=0` 只允许 diagnostic/legacy compatibility run 使用，不能把非浏览器素材发布成 approved。
  type: release_gate
- category: source_material
  id: forbid_non_browser_capture_methods_in_approved_release
  rule: approved release 禁止 downloaded_or_copied_readme_embedded_image、copied_repository_image_asset、downloaded_curated_remote_repository_image、downloaded_curated_external_project_related_image、downloaded_project_related_github_issue_or_discussion_image、downloaded_first_frame_from_curated_repository_gif、extracted_frame_from_repository_video_or_gif、quicklook_thumbnail_cropped_from_repository_demo_output、quicklook_thumbnail_cropped_from_repository_file
    等非浏览器 capture_method。
  type: release_gate
- category: source_material
  id: forbid_simulated_readme_source_render
  rule: approved release 和 diagnostic 记录都禁止把 Markdown/README/source 用本地 HTML、PIL、模板、source card 或 actual_browser_source_readme_content_screenshot 伪装成浏览器素材；README 必须在真实浏览器里打开原页面再截图。
  type: visual_review
- category: copy
  id: bottom_story_arc_not_source_labels
  rule: 底部卡片必须承担钩子和故事推进，不得退化为逐帧图片来源说明；中间区域默认不显示 visual_title，来源说明放 image_labels、footer、source manifest 或发布包。
  type: copy_review
- category: route
  id: compact_duration_scene_count
  rule: 默认成片必须控制在4-5页、总时长固定15秒；profile 不得覆盖为其他时长。
  type: planning_review
- category: copy
  id: user_interest_fact_chain_required
  rule: 底部事实链必须先服务目标用户兴趣：每个事实都要解释用户为什么在意、为什么继续看、有什么证据或边界；不得堆中性功能点。
  type: copy_review
- category: copy
  id: viewer_value_modules_required
  rule: 写公开视频底部卡前必须先分 3-5 个 viewer_value_modules；每个模块记录 source_facts 和 viewer_values。source_facts 来自原仓库 README、示例、脚本、配置、产物图、demo 或本地实测；viewer_values 才能进入画面。每句话都必须回答用户为什么在意，不能把检查步骤写给观众。
  type: copy_review
- category: copy
  id: no_public_process_checklist_voice
  rule: 公开视频、封面、发布正文和底部卡不得把制作者流程或 QA 步骤写给观众，例如“要提前说清”“重点查”“打开看”“拿材料试”“能打开编辑才算过关”。改成用户收益、输出物、流转场景或事实边界。
  type: copy_review
- category: audio
  id: no_voiceover_default_required
  rule: repo_signal_grid 的公开合同不生成口播、不烧字幕；voice 必须保持 none。
  type: audio_quality
- category: hook
  id: retention_share_comment_hypothesis_required
  rule: 生成标题和分镜前必须写内部 retention/share/comment hypothesis：0-2秒停留理由、逐页追看理由、收藏/转发理由、评论钩子和事实边界。公开视频不得出现这些内部术语。
  type: copy_review
- category: copy
  id: stop_stay_save_comment_supported
  rule: 4-5页事实链整体必须同时覆盖停留、追看、收藏/转发、评论四类目标；单页至少支撑痛点、机制、证明、后果、边界、评论张力中的两类。
  type: copy_review
- category: publishing_package
  id: comment_trigger_not_generic
  rule: 发布标题/正文/置顶评论必须包含一个基于项目真实取舍的评论钩子；不得只写“你怎么看/欢迎评论”。
  type: copy_review
- category: planning
  id: project_value_scouting_required
  rule: 严肃成片必须产出 project_value_scouting/value_card：硬事实、可包装价值、最强证据、目标用户压力、收藏/转发理由、评论钩子、禁止夸大点。
  type: artifact_required
- category: fact_boundary
  id: fact_to_value_boundary_map_required
  rule: 每个“可吹嘘”的标题、底部卡片或发布文案主张，都必须能映射到源事实或明确标注为编辑推断；不能偏离 repo/README/源码/文档能支持的范围。
  type: content_review
- category: fact_boundary
  id: bole_packaging_no_invention
  rule: 允许伯乐式放大价值：把事实包装成用户痛点、成本、质量、风险或团队意义；禁止发明功能、保证效果、夸大适用范围或把边界说成能力。
  type: copy_review
- category: hook
  id: title_bakeoff_includes_debate_variant
  rule: 标题候选必须至少包含成本收益、停止旧做法、证据+转化、评论争议四类；最终标题要在事实安全前提下优先选择能引发停留和判断的版本。
  type: copy_review
- category: strategy
  id: strategy_is_hypothesis_not_best_claim
  rule: 内部可以使用默认高胜率框架，但不得宣称框架放之四海皆准；有数据后用 A/B 表现迭代标题、首屏、底部事实链和评论钩子。
  type: planning_review
- category: hook
  id: title_hook_specific_memory_and_use_required
  rule: 主标题必须强相关到目标项目的专属识别物，并说明具体用途或核心转化；只写星标数、截图数、skill 数量、开源/AI工具类别，导致陌生观众不知道项目干嘛的，算失败。
  type: copy_review
- category: audience
  id: user_value_translation_required
  rule: repo/tool/skill 视频必须把仓库事实翻译成目标用户能理解的具体用途、任务收益和收藏理由；README 摘要、星标、数量、类别和作者视角都不能替代用户价值。
  type: copy_review
- category: hook
  id: skill_collection_examples_required_when_applicable
  rule: 当项目是 skills/tools 集合时，必须先归纳用户工作流，并展示 3-5 个代表技能或产物；数量只能作为证明，不是核心钩子。
  type: copy_review
- category: visual_copy
  id: six_by_seven_source_with_safe_space
  rule: 6:7 默认版式固定把关键信息限制在 y=30..1230；顶部30px和底部30px继续使用与中部完全一致的暖白橙网格背景，不得留白或切换背景色。画布必须通过压缩纵向区段重排成 1080×1260，不得把 9:16 成片直接拉伸变形。
  type: layout_review
- category: visual_copy
  id: six_by_seven_dynamic_bottom_density
  rule: 6:7 底部卡片默认位于约 y=790..1215 并启用动态排版；正文根据行数、宽度和可用高度自动放大并均匀分布，脚注必须停在 y=1230 之前。五行事实链不得因为裁高而缺行、溢出或被遮挡。
  type: layout_review
- category: source_material
  id: middle_visual_real_assets_no_summary_cards
  rule: 中间主视觉不得使用自制文字总结卡替代真实素材；真实浏览器 README/仓库关键区域截图可以作为 browser_evidence_screenshot，仓库自带图片、README/docs
    内嵌图、demo/UI/产物截图、GIF/视频或网上相关原始图片/视频也可以进入 approved。普通 documentation_screenshot 只做诊断，不凑 approved 成片。
  type: visual_review
- category: visual
  id: middle_visual_pure_material_no_repeated_title
  rule: 中间主视觉默认只放资料图本身，不额外显示 visual_title、重复标题或 image_labels；如确需中间标题或图片标签，必须在 profile/scene 显式设置 show_middle_title true 或 show_image_labels true。
  type: layout_review
- category: visual
  id: middle_visual_no_repeated_title_stronger
  rule: 中间素材区默认只放纯资料图，不重复主标题、副标题、项目名或底部卡判断；source 信息放顶部徽标、小脚注、manifest、QA 或发布包。只有 profile/scene 显式开启 show_middle_title 或 show_image_labels 时，才允许中间标题或图片标签。
  type: layout_review
- category: source_material
  id: middle_visual_material_ladder_v2
  rule: 中间主视觉按 actual-source ladder 选材：第一帧优先真实浏览器 README/仓库关键区域截图；之后优先真实结果/产品素材，例如 README/docs demo 图、输出图、UI 截图、PPT/报告结果图、前后对比、GIF/视频帧、gallery/theme
    preview；再用相关 primary-source 原始图片/视频帧。普通 documentation_screenshot 和真实 source/example/config 文件截图只做 blocked/diagnostic 诊断。
  type: visual_review
- category: source_material
  id: repo_visual_asset_audit_before_screenshots
  rule: 中间主视觉选择顺序是：第一帧优先真实浏览器 README/仓库关键区域截图，再审计仓库提供的图片、README/docs 内嵌图、demo/UI/产物图、GIF/视频。普通
    README/GitHub/source 文档截图不能被写成 approved 默认，只有 browser_evidence_screenshot 可以补足 approved 多页视频。
  type: visual_review
- category: publishing_package
  id: wechat_social_value_gate_required
  rule: 视频号推荐标题和正文必须先完成内部 wechat_social_value_gate：至少命中 hard_value、distinctive_view、unexpected_use
    之一，并说明 like_signal 或 share_target 为什么成立；公开文案不得暴露这些内部字段名。
  type: copy_review
- category: publishing_package
  id: wechat_no_generic_interaction_copy
  rule: 视频号标题、正文、短正文、置顶评论不得只写泛泛的点赞、收藏、转发、分享；如果引导互动，必须说明具体判断、方法、使用场景、熟人价值或可信边界。
  type: copy_review
- category: copy
  id: wechat_abstract_methodology_boundary
  rule: 视频号社交价值规则只能作为通用方法论：不要把某个成功样例、项目类型、成本话题、流程话题或圈层语境固化为所有内容的默认判断；不适合时回到项目事实和用户价值。
  type: copy_review
- category: hook
  id: wechat_distinctive_view_user_value_preferred
  rule: 视频号标题候选应优先评估是否有独特视角并对目标用户有实际价值；没有独特视角时，用极致干货或非显而易见用法支撑，而不是降级成项目介绍。
  type: copy_review
- category: source_material
  id: middle_visual_source_priority_github_web_readme
  rule: 中间主视觉素材优先级必须把真实浏览器 README/仓库关键区域截图放到第一帧优先级：截图到 README 内容、stars、项目说明或关键区域；其后使用真实结果/产品素材、README/docs
    内嵌图、官方/项目方/primary-source 图片或页面内容截图。source/example/config 文件截图只能在 blocked/diagnostic 里证明机制、输入或输出边界。
  type: visual_review
- category: source_material
  id: no_commentary_or_recut_video_as_source_material
  rule: 网上视频素材不得使用解说、reaction、教程讲解、搬运混剪或二次加工视频；只使用原始 demo、官方/项目方素材或可证明主张的原片段。
  type: visual_review
- category: source_material
  id: readme_screenshot_content_only
  rule: browser_evidence_screenshot 截图必须来自实际用浏览器打开的 GitHub/官方页面，优先截 README 渲染内容区，也可以截 stars、项目说明或其他关键区域；不得把 Markdown 文本用本地
    HTML/PIL/模板重新排版成 README 图片，也不得把 GitHub 纯代码目录、文件列表、侧栏或浏览器周边作为素材展示。
  type: layout_review
- category: motion
  id: middle_visual_aspect_adaptive_motion
  rule: 长图从上往下展示，宽图从左往右展示，比例接近素材区域时做局部放大。
  type: visual_review
- category: copy
  id: no_commercial_available_default
  rule: 公开视频不要写“商用可用”、MIT 或其他协议名；开源信息只写“开源免费”。用户要求授权细节时，放到发布包或 internal/technical，不上屏。
  type: copy_review
- category: copy
  id: no_internal_motion_terms_visible
  rule: 公开视频和可见文案禁止出现 MIT、商用可用、长图按页面滚动、页面滚动、滚动展示、缩放抖动。
  type: copy_review
- category: feedback
  id: minor_feedback_scope_control
  rule: 局部反馈先局部修正，不自动重渲染，不把单点反馈当成核心重做。
  type: planning_review
- category: copy
  id: no_video_cta_value_density_required
  rule: 不在视频画面写 CTA；最后 1 页也必须是价值密度总结，继续提供项目结果、证据、适用场景、边界或怎么问的价值信息，不写评论、关注、收藏、下条、安装承接。
  type: copy_review
- category: copy
  id: user_prompt_utility_translation_required
  rule: 当输入或反馈包含明确目标人群、身份词或“必看/必备/收藏”等传播提示时，默认作为内部受众线索；公开文案必须翻译成具体用途、输入资料、输出结果、使用场景和事实边界，并避免“X人必看”式人群诱导。
  type: copy_review
- category: copy
  id: ai_flavored_template_copy_forbidden
  rule: 公开视频、封面、标题、底部卡片和发布正文不得使用模板化 AI 句式、否定转折模板或三段式口号；必须直接写具体用途、输入资料、输出结果、使用场景、结果或事实边界。
  type: copy_review
- category: copy
  id: progressive_information_arc_required
  rule: 默认 4-5 页短视频必须层层递进：每一页只推进一个新信息；上一页的疑问由下一页回答或推进；可以围绕问题定位、输入或素材、机制展开、证据证明、输出和实用判断组织，但应按本项目最强的一眼价值选择顺序；如果任意调换页面顺序不影响理解，说明信息链太平，必须重写。
  type: copy_review
- category: copy
  id: attention_retention_arc_required
  rule: 默认短视频文案关系必须符合人的注意力机制：先用冲突或代价制造认知缺口，再让观众情绪代入，中段给反转或新判断，随后用证据补信任，最后给出能帮助使用决策的信息；每页结尾都要留下继续看的理由。
  type: copy_review
- category: copy
  id: no_x_is_y_not_z_template
  rule: 公开视频、封面、标题、底部卡片和发布正文禁止使用“X 是 Y，不是 Z”“不是 A，而是 B”“X 不是 Y，是 Z”这类解释式否定转折；必须改成具体动作、结果、输入输出、用户收益或可执行下一步。
  type: copy_review
- category: visual_copy
  id: no_visible_urls_or_links
  rule: 公开视频、封面、标题、底部卡片、发布正文、image_labels/footer 和中间截图不得出现网址、域名、URL、二维码、扫码或链接引导；可见素材含网络地址时必须裁掉或遮住，裁不干净就换素材。
  type: copy_review
- category: source_material
  id: no_link_material_selection
  rule: 选材阶段必须避开露出网络链接的截图、命令块和网页区域；使用 GitHub/README 来源时只保留无网址的内容区。
  type: visual_review
- category: source_material
  id: actual_source_asset_manifest_required
  rule: 严肃成片必须在 profile 或 inputs/source_asset_manifest.json 中列出每个中间主视觉的真实来源：asset_id、path、asset_type、source_kind、source_url_or_repo_path、capture_method、reconstructed_card=false。没有该清单不能进入
    approved release。
  type: artifact_required
- category: source_material
  id: reconstructed_cards_not_real_sources
  rule: Agent/PIL/HTML 手工重构的 README 摘要卡、证据卡、文字排版卡、AI 生成概念图、重新打字的来源摘录，一律不算真实素材或实际图。README 也不能用本地 Markdown/HTML/PIL 模拟生成；只能用真实浏览器打开原页面后的内容区截图做 diagnostic。它们只能进入
    blocked/preview 记录，不能作为 approved release 的中间主视觉。
  type: visual_review
- category: source_material
  id: fallback_generated_card_preview_only
  rule: 如果中间主视觉使用 fallback_generated_card，release status 只能是 preview 或 blocked；不能标为 approved。
  type: release_gate
- category: source_material
  id: actual_source_frame_minimum
  rule: 默认 4-5 页短视频至少 4 页中间主视觉必须来自 actual_browser_* 截图：GitHub README/仓库关键区域、README/docs 页面中可见图片元素、X 搜索/公开讨论或外部项目 docs/demo/release 页面。仓库自带图片、下载的
    README/docs 内嵌图、真实 demo/UI/产物截图、GIF/视频帧或相关 primary-source 原始图片/视频帧只做 diagnostic/compat，不进入 approved 成片。source/SKILL/manifest 文件内容截图只做诊断。
  type: visual_review
- category: source_material
  id: real_screenshot_fallback_before_cards
  rule: 当仓库没有足够浏览器截图时，优先截取真实 GitHub README/仓库关键区域或真实网页内容区作为 browser_evidence_screenshot；必须裁掉地址栏/URL/侧栏/文件列表，并确保画面能说明项目内容或价值。普通文档和源码截图仍只作为
    skipped_missing_material 诊断证据。
  type: visual_review
- category: source_material
  id: source_contact_sheet_actuality_review
  rule: QA 必须生成 source material contact sheet，并逐张标注 actual_source / fallback_generated_card。若实际截图看起来像重新排版卡片、没有原页面/原
    UI/原产物痕迹，按非真实素材处理。
  type: visual_review
- category: source_material
  id: rich_result_visuals_before_text_screenshots
  rule: 仓库存在结果图、产物图、机制图、图表、UI/demo、GIF、视频或 gallery 时，中间主视觉必须优先使用这些 rich visuals；README
    源码、代码、命令、文件名、manifest 截图不得进入 approved 中间主视觉。
  type: visual_review
- category: source_material
  id: readme_main_page_screenshot_fallback_only
  rule: README 主页面/渲染内容区截图可以作为 browser_evidence_screenshot 进入 approved 主视觉，第一帧优先；但必须是实际浏览器关键区域截图，能看到
    README 内容、stars、项目说明或关键区域。不得用 README 源码卡、浏览器地址栏、文件列表、侧栏或命令块截图充 approved 主视觉。
  type: visual_review
- category: source_material
  id: source_file_command_screenshot_proof_only
  rule: 源码、命令、安装步骤、文件树、manifest、SKILL.md 截图只用于 skipped_missing_material 或 blocked/diagnostic 证明特定主张；不能替代结果图/机制图成为 approved 主要画面。
  type: visual_review
- category: capsule_method
  id: repo_signal_grid_current_playbook_required
  rule: 严肃 repo_signal_grid 运行必须遵循 recipes/copy.md 与 recipes/motion.md 的当前 playbook：真实丰富视觉优先、4-5 行完整句底部价值卡、人味自媒体文案、顶部标题足够行距、公开文案一致性和最终
    QA。
  type: planning_review
- category: source_material
  id: visual_result_mechanism_before_text_screenshots_v2
  rule: 选中间主视觉时先用仓库里的结果图、产物图、机制图、图表、UI/demo、GIF、视频或 gallery；代码、命令、文件名、README 源码和文件树截图不能作为 approved 主视觉。
  type: visual_review
- category: source_material
  id: readme_main_page_screenshot_fallback_only_v2
  rule: README 主页面/渲染内容区截图可以作为第一帧 browser_evidence_screenshot；截图必须裁掉浏览器地址、URL、侧栏、文件列表、命令块和源码视图，并且要截到
    README 内容、stars、项目说明或关键区域。普通 documentation_screenshot 仍只做 blocked/diagnostic。
  type: visual_review
- category: visual_copy
  id: bottom_cards_complete_five_line_value_copy
  rule: 底部卡默认优先 5 行、允许 4 行；每行应是完整句子，且是完整、通顺、可独立读懂的句子。可以比 20 个中文字更长，但必须在手机预览、contact sheet 和最终画面里读得清。整张卡必须自然推进用户价值、特别机制、事实证据、输出价值或可信边界，不按固定行位填槽。创作规则不要求单独 bottom_title，实际验收只看观众能看到的 4-5 行事实链，不能写碎片标签、教程步骤或 README 摘要。
  type: copy_review
- category: visual_copy
  id: bottom_card_4_to_5_lines
  rule: 下方事实卡必须是 4-5 行可见完整句，默认尽量 5 行、允许 4 行；每行要像一句人能顺着读下去的话，不为了变短写成碎片标签。整张卡围绕一眼价值、具体锚点、特别机制、证据、结果、边界或取舍自然递进，不按第几行写什么验收。不得自动压成 2 行；不把 bottom_title 当成创作必填项，renderer 字段只是实现细节。
  type: copy_review
- category: visual_copy
  id: material_first_value_copy_required
  rule: repo_signal_grid 底部卡按材料优先价值写法验收：第一句先写具体省事物，中段必须出现来自仓库事实的可数锚点，例如数字、格式、模块、工具名、文件类型、图标库、模板数或输出格式；随后说明交付质感，例如更像正式文档、能继续改、能交给同事或能进汇报；最后给具体事实边界。示例口径：真正省事的是图形库。10,000+ shapes 可以直接搜索。云厂商和 K8s 图标能放进图里。做出来的方案图更像正式文档。这些图标不等于厂商背书。
  type: copy_review
- category: copy
  id: repo_signal_grid_one_glance_value_required
  rule: repo/tool/skill 标题、主视觉和底部卡必须让目标用户一眼知道能做什么、特别在哪里、凭什么信、怎么开始或哪里要小心；文案应从 result_first、hidden_resource、comparison、risk_warning、numbers_proof、demo_shock、authority_signal 等开源项目账号钩子里选择合适路径。不得只解释项目是什么、只堆 README 功能或只报 stars/forks。
  type: copy_review
- category: hook
  id: github_star_proof_native_wording
  rule: GitHub repo 的星标 proof 优先使用 GitHub 页面当期显示的 rounded star count；避免把 k 计数和中文星字硬拼，也不要把未复核的精确星标写成实时数字。stars 不单独成句，后面要接项目对象、输入输出、特别机制或使用边界。
  type: copy_review
- category: visual_copy
  id: bottom_title_not_visible_required
  rule: 下方卡片不得出现独立 bottom_title 标题层；如果需要一句判断，写进 bottom_lines 第一行。实际成片只允许 4-5 行事实链加必要小脚注，不能再额外加底部标题。
  type: layout_review
- category: publishing_package
  id: public_copy_human_self_media_not_ai_summary
  rule: 发布标题、正文、置顶评论必须像真人自媒体判断：从具体用户场景切入，有自然推进和事实边界；如果删掉项目名后仍像通用 AI 工具摘要，必须重写。
  type: copy_review
- category: visual_copy
  id: top_title_spacing_min_16
  rule: 两行顶部标题默认 top_title_line_gap_preferred 至少 16；首帧抽检不得出现描边重叠、字行贴住或中文笔画挤压。
  type: layout_review
- category: hook
  id: top_title_two_large_lines_with_skill_type
  rule: 顶部必须使用两行大字标题：第一行写用户价值钩子，第二行写清是什么 Skill/Skills 类型，例如 PPT 生成 Skill、PDF 处理 Skills、Office Skills 或 Agent Skills；不要只把 Skills 类型放进小副标题。小副标题只补 owner/repo、stars 或短路径身份。
  type: layout_review
- category: copy_review_loop
  id: show_copy_before_render_when_requested
  rule: 当用户要求先看文案，必须先给标题、章节、每幕底部 4-5 行事实链、发布正文和置顶评论；用户认可后才能开始渲染视频。不要把 bottom_title/bottom_lines 当成对外创作格式，只可作为 renderer 实现字段。
  type: workflow_review
- category: publishing_package
  id: public_package_copy_consistency_after_rerender
  rule: 每次重渲染后检查 public/copy.txt、publishing_package.md、platform_copy_manifest.json
    是否仍是同一版人化公开文案，不能被运行时 copy 覆盖回 profile 摘要。
  type: artifact_review
- category: hook
  id: copy_hook_patterns_required
  rule: repo_signal_grid 写标题、底部卡或发布文案前，必须从 recipes/copy.md 的 hook_and_title 选择合适的钩子模式，并用仓库事实、具体用户场景和数字锚点改写；不能直接套公式或写成广告。
  type: copy_review
- category: hook
  id: title_category_difference_result_required
  rule: 主标题必须先过“熟悉品类 + 反常识新能力 + 具体结果”检查：有用户一眼能懂的品类入口，有项目区别于同类的差异动词，有可见输入输出或副标题补充；只有场景、只有项目名或只有抽象能力都算失败。
  type: copy_review
- category: copy
  id: copy_editorial_analysis_required
  rule: repo_signal_grid 的底部卡、发布正文和置顶评论不能只复述 README 或功能列表；必须有自己的分析和切入点：先写目标用户的已有认知、默认期待、同类默认印象或现有替代路径，再写项目的非显而易见差异、证据、适用边界或取舍。每页底部卡至少推进一个判断，只有事实罗列或营销式硬夸都算失败。
  type: copy_review
- category: copy
  id: self_media_label_user_angle_required
  rule: 自媒体文案必须有用户能懂的标签和用户视角：发布标题、封面、首屏、底部卡或正文至少两处说清给谁看、什么场景、属于什么品类、能拿到什么结果或有什么争议/差异；必须通过“一眼能看懂、一眼想点、3 秒复述、陌生用户测试”。只有项目名、星标、开源、AI 工具或技术术语都算失败。
  type: copy_review
- category: hook
  id: pain_must_be_concrete_with_anchor
  rule: 痛点不能抽象写效率低、价格高、质量差；必须写具体场景、对象、文件、页码、时间、成本、改稿动作或失败后果。涉及对比时优先使用可信数字锚点。
  type: copy_review
- category: copy
  id: numeric_anchor_no_fake_percent
  rule: 数字锚定只使用 GitHub、README、样例、源码、本地实测或明确场景数字；没有来源时不得编百分比、折扣、耗时或成本。
  type: fact_boundary
- category: visible_copy
  id: hook_formula_terms_not_visible
  rule: 公开视频、封面、底部卡、旁白字幕、发布正文和置顶评论不得出现公式名、钩子公式、痛点公式、数字锚定、叙事模式等制作术语。
  type: copy_review
- category: copy_review_loop
  id: copy_planning_outputs_required_when_script_requested
  rule: 用户要求先看文案时，输出必须包含选中标题、章节划分、徽章/主体路径展示方式、每幕底部 4-5 行事实链、发布正文和置顶评论。
  type: workflow_review
- category: motion
  id: content_aware_motion_policy_required
  rule: 每个分镜必须先确定与底部事实链对应的核心证据区域，再根据截图范围、内容特征和关系选择动效：单一证据优先紧裁；保留上下文时使用 local_zoom；只有多区域的顺序或对比本身有意义时才做长轴移动；普通结果图才使用滑入。
  type: visual_review
- category: motion
  id: detail_images_should_zoom_or_focus
  rule: 数据图表、PPT 缩略图、UI 面板、表格、小字截图和机制图如果 contain 后难以看清，必须使用 zoom_in、center_zoom 或
    local_zoom，并优先用 core_focus 指向信息重点，兼容使用 motion_focus。
  type: visual_review
- category: motion
  id: long_axis_images_should_scroll
  rule: 明显高于或宽于展示区域的素材只有在多个区域的顺序或全貌本身是证据时才使用长边位移；当一块 README、结果图、表格或 UI 区域承担该幕核心主张时，显式 core_focus 的局部放大优先于上下滑或左右滑。禁止为了展示整页而让核心证据始终过小。
  type: visual_review
- category: source_material
  id: core_region_capture_or_focus_zoom_required
  rule: 每幕必须先命名与底部事实链直接对应的核心证据区域；优先在浏览器中紧贴核心区域截图。必须保留上下文时，source_asset_manifest 需记录 capture_scope=context_plus_core 和 core_region_description，scene 需使用 core_focus 与 local_zoom。
  type: visual_review
- category: source_material
  id: core_region_occupancy_minimum
  rule: 去除浏览器外壳、导航、侧栏、文件列表、地址、无关上下文和空白边距后，命名的核心证据区域应占截图至少 65%；同时保留理解证据所需的标题、图例、标签、数字和比较关系。
  type: visual_review
- category: source_material
  id: broad_context_requires_named_core_focus
  rule: 宽泛整页或大段上下文截图默认不通过；只有保留上下文对理解证据确有必要，且 manifest 命名 core_region_description、scene 显式设置 core_focus 与 local_zoom 时才可进入 approved release。
  type: visual_review
- category: source_material
  id: mobile_portrait_capture_only_for_mobile_ui
  rule: GitHub/README 证据默认使用贴合中部横向面板的响应式横向截图；只有项目证据本身是移动端 UI 时才使用手机竖屏截图。
  type: visual_review
- category: motion
  id: core_region_visible_in_keyframes
  rule: 每幕首秒、中点和 contact sheet 必须能看清核心证据与底部事实链的对应关系；若标题、数字、图例、标签或关键 UI 仍不可读，需重新截图、减小放大幅度或改写本幕判断。
  type: visual_review
- category: copy
  id: user_usefulness_before_implementation_detail
  rule: repo/tool/skill 展示的公开视频必须先回答用户为什么需要、什么场景适合、要准备或确认什么、会拿到什么结果；技术实现、依赖、命令、协议、源码路径只能放
    internal/technical，除非目标用户确实需要这些信息来判断是否使用。
  type: copy_review
- category: copy
  id: public_copy_only_viewer_language
  rule: 公开视频、封面、底部卡、片内文字和平台正文只能使用观众语言；制作回复、用户反馈原句、版本修正原因、QA 备注、manifest 字段名、source/real asset/draft 等内部或交付词必须留在 internal/qa/technical，不得进入公开视频。
  type: copy_review
- category: copy
  id: plain_language_for_office_audience
  rule: 面向办公/提效/普通业务用户时，标题和公开文案必须优先使用中文任务词和交付物词，例如 PPT、汇报稿、网页 PPT、表格体检、报告初稿、流程清单；deck、harness、agent framework 等小圈子术语不得做主标题，除非目标用户确实需要并且同时给出白话解释。
  type: copy_review
- category: copy
  id: viewer_decision_information_required
  rule: 每版公开文案至少覆盖 4 类对使用决策有帮助的信息：目标用户/工作场景、可输入的材料或对象、使用前提或权限边界、输出物或后续流转、适用/不适用边界、风险或缺口说明。只写功能摘要、项目简介或实现路线视为不通过。
  type: copy_review
- category: visual_copy
  id: technical_terms_visible_only_when_decision_relevant
  rule: 可见文案里的技术名词必须服务用户决策：面向普通办公/业务用户时，把 API、CLI、token、脚本、命令、源码、依赖等改写成资料类型、操作前提、输出结果或边界；面向开发者/工程项目时可保留必要术语，但必须解释它对用户结果的影响。
  type: copy_review
- category: qa
  id: qa_visible_subject_identity_required
  rule: QA 必须从实际成片或 contact sheet 可见文字中确认主体身份准确出现：单项目有 `owner/repo` 或短 Skill path；多 Skill 视频有 subject_paths 或同等多对象列表；主标题还必须说清它是什么 skills/tools 以及优势、特点或具体用途，不能只有路径。
  type: layout_review
- category: audience
  id: respect_user_ecosystem_constraints
  rule: 如果用户显式指定目标受众、地域、行业、平台生态、工具栈、排除项或素材来源约束，选题、素材、案例和公开文案必须贴合这些约束；不要把某一次案例中的生态偏好沉淀为全局默认。若项目事实与用户约束冲突，先说明冲突并等待取舍或改选项目。
  type: planning_review
- category: hook
  id: title_problem_use_mechanism_required
  rule: repo/tool/Skill 标题生成前必须完成 recipes/copy.md 的 user_value_translation_card。最终标题第一阅读单元要让用户认出具体任务、摩擦或想拿到的结果，并出现项目专属动作、机制或可用结果；只有项目介绍、类别、技术名词、stars、功能数量或“提升效率”等泛化能力，视为不通过。
  type: copy_review
- category: copy
  id: publishing_copy_value_chain_required
  rule: 发布标题、正文、底部事实链和置顶评论必须自然推进“当前替代/具体成本 -> 项目如何动作 -> 可交付结果 -> 适用人群、前提或边界”。前两句优先先说用户为什么需要，再说项目怎么做到；不得按 README 顺序罗列功能，也不得让 proof 数字替代用途。
  type: copy_review
- category: copy
  id: core_feature_non_replaceable_required
  rule: 每个 repo/tool/Skill 必须先写一句内部核心特点：适合谁或什么场景、解决什么具体摩擦、独特在什么机制。核心特点换成另一个项目仍成立，或只写开源、可扩展、多格式、AI 能力、提升效率等类别词，必须补查事实并重写后才能进入 approved release。
  type: copy_review
