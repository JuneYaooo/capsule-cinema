- id: original_repo_screenshot_minimum
  phase: pre_render
  severity: blocker
  checker: manifest_item_type_counts
  params:
    manifest_path: source_asset_manifest
    field: asset_type
    allowed_values:
    - browser_evidence_screenshot
    - readme_embedded_image
    min: 1
- id: bottom_title_not_visible_required
  phase: pre_render
  severity: blocker
  checker: forbidden_profile_fields
  params:
    fields:
    - scenes[].bottom_title
- id: bottom_card_4_to_5_lines
  phase: pre_render
  severity: blocker
  checker: list_length_between
  params:
    path: scenes[].bottom_lines
    min: 4
    max: 5
- id: fallback_generated_card_preview_only
  phase: release
  severity: blocker
  checker: fallback_blocks_approved_release
  params:
    fallback_markers:
    - fallback_generated_card
    allowed_release_status:
    - preview
    - blocked
