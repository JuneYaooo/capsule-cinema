roles:
  image:
    prefers:
    - high_quality
    - realistic_photo
    requires: []
    validated_with: GptImage2Tool
  video:
    prefers:
    - dynamic_motion
    - high_quality
    - ecommerce
    requires:
    - image_to_video
    validated_with: Seedance20VideoGeneratorTool
  voice:
    prefers_enums:
      lang: zh-CN
      tone: energetic
    requires: []
    validated_with: local_system/zh_female_default
output_contract:
  add_background_music: true
  add_subtitles: true
  aspect_ratio: '9:16'
  bgm: external
  clip_audio: silent
  duration_seconds_range:
  - 15
  - 30
  has_narration: true
  on_frame_text: forbidden
  scene_count_range:
  - 4
  - 6
  subtitle: overlay
  voice: unified_tts
video_elements:
  fixed:
    visual_generation_type: gpt_image2_first_frame_to_seedance2_image_to_video
  defaults:
    aspect_ratio: '9:16'
    target_duration: 20
    target_duration_range:
    - 15
    - 30
    target_duration_max: 30
    bgm_volume: 0.055
    voice_volume: 1.45
    subtitle_max_chars: 14
    generated_scene_count_range:
    - 4
    - 6
  user_overridable: {}
  forbidden: []
