roles:
  image:
    requires: []
    validated_with: VolcengineImageGeneratorTool
  video:
    requires:
    - image_to_video
    - native_audio
    validated_with: Seedance20VideoGeneratorTool
output_contract:
  bgm: external
  clip_audio: native
  on_frame_text: none
  subtitle: overlay
