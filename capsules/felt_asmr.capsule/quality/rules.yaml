rules:
- category: final_video
  id: final_video_required
  type: artifact_required
- id: manifest_required
  type: manifest_required
- category: assembly_clean
  id: clean_concat_preserved
  type: artifact_required
- category: copywriting
  id: copywriting_present
  type: artifact_required
- category: qa_report
  id: local_video_qa_required
  type: artifact_required
- category: compliance_report
  id: compliance_review_required
  type: artifact_required
- category: final_video
  expected_aspect_ratio: '9:16'
  id: aspect_ratio_valid
  min_duration_seconds: 28
  require_audio: true
  type: video_quality
- id: first_2s_tactile_hook
  rule: First two seconds must contain a visible tactile action, not a static setup.
  severity: blocker
  type: manual_or_local_qa_gate
- id: material_consistency_gate
  min_score: 7
  rule: All food surfaces must remain visibly wool-felt/plush, including baked/cut
    interiors.
  severity: blocker
  type: manual_or_local_qa_gate
- id: real_food_leak_blocker
  rule: Reject shots that read as real pastry, liquid custard, molten cheese, wet
    batter, realistic crumb, or edible bakery footage.
  severity: blocker
  type: manual_or_local_qa_gate
- id: visual_attraction_gate
  min_score: 7
  rule: Each scene must have strong macro composition, clear subject, tactile material
    contrast, and pleasing low-saturation color.
  severity: high
  type: manual_or_local_qa_gate
- id: tactile_event_density
  rule: Final edit should include 14-20 micro-shots; no unchanged action held longer
    than 3 seconds.
  severity: high
  type: edit_plan_gate
- id: continuity_tail_frame_inheritance
  rule: Stateful sequences after shaping must inherit tail frames or equivalent exact
    state references.
  severity: high
  type: workflow_gate
- id: seedance_audio_no_music
  rule: Seedance prompts require close-up ASMR foley only and explicitly forbid BGM, melody,
    singing, speech, voiceover, subtitles, and text.
  severity: blocker
  type: prompt_gate
- id: bgm_under_foley
  rule: Post BGM must stay under foley; recommended BGM volume 0.05-0.09 and final
    mean volume around -33 to -29 dB.
  severity: medium
  type: audio_gate
- id: reference_side_by_side_gate
  rule: If a reference is available, local QA side-by-side verdict must be similar or
    right_better, with wool_felt_consistency >= 7 and viral_format_match >= 7.
  severity: blocker
  type: local_qa_gate
- id: no_rendered_text
  rule: No generated subtitles, captions, labels, logos, watermarks, or readable text
    inside image/video generation.
  severity: blocker
  type: prompt_gate
- id: visible_process_grammar_gate
  rule: 'Any visible real-world action beat must be physically and causally legible:
    necessary object affordance is visible, tool/hand contact and direction are plausible,
    and the visible result follows. Intermediate steps may be omitted only when hidden
    by cuts, occlusion, close-ups, sound, or time-jump cues.'
  severity: blocker
  type: manual_or_local_qa_gate
- id: oven_visible_beat_plausibility_gate
  rule: Oven is an example of visible process grammar, not a mandatory full-chain
    template. Insertion/removal shots may stand alone, but if shown they must include
    a plausible oven structure such as door/door frame/cavity and sensible tray direction;
    active heating should not be implied by an obviously open-door shot.
  severity: high
  type: manual_or_local_qa_gate
- id: state_continuity_map_required
  rule: Storyboard must label each scene with state_before, state_after, continuity_mode,
    reference_sources, identity_lock, allowed_change, and transition_mask before generation.
  severity: high
  type: workflow_gate
- id: hard_continuity_reference_gate
  rule: Any adjacent state-critical action marked hard_tail_inherit must use the previous
    stable tail frame, first/last frame, or an equivalent exact state reference; otherwise
    the action must be hidden by a deliberate transition.
  severity: blocker
  type: workflow_gate
- id: soft_transition_mask_gate
  rule: Expected transformations such as demold, bake, cool, plate, or decorate may
    change state, but adjacent edits must preserve identity locks and hide skipped
    steps with occlusion, cutaway, flash, ding, hand cover, or macro insert.
  severity: high
  type: manual_or_local_qa_gate
- id: reference_profile_required
  rule: Every storyboard scene must include reference_profile with type, count, images,
    lock, allowed_change, and avoid before generation.
  severity: blocker
  type: workflow_gate
- id: reference_count_policy_gate
  rule: reference_profile must use 0 refs for free tactile inserts, 1 previous ref
    for hard adjacent actions, 1 target ref for deliberate later-stage jumps, or 2
    refs for controlled previous-to-target transformations; do not use more than 2
    raw refs.
  severity: high
  type: workflow_gate
- id: reference_lock_axes_gate
  rule: Scene review must check subject_consistency, scene_consistency, and state_consistency
    locks whenever a reference_profile uses one_ref_previous, one_ref_target, or two_ref_transition.
  severity: high
  type: manual_or_local_qa_gate
- id: state_anchor_reference_matrix_gate
  rule: Before generation, every storyboard scene must classify viewer-tracked continuity
    and list process_state_id, continuity_mode, reference_profile.type/count/images,
    identity_lock, allowed_change, and transition_mask.
  severity: blocker
  type: workflow_gate
- id: multi_reference_intent_gate
  rule: Use multiple references only for controlled previous-to-target transformations.
    Two raw refs must mean previous stable state plus canonical target still; otherwise
    use one previous ref, one target ref, or no ref.
  severity: high
  type: workflow_gate
- id: visible_heat_closed_or_masked_gate
  rule: Any visible heat, glow, ding, puff, browning, or bake cue must occur behind
    a closed door/lid or after a clear offscreen transition mask. Open structures
    may show only insertion/removal/contact, not active transformation.
  severity: blocker
  type: manual_or_local_qa_gate
- id: large_frame_state_review_gate
  rule: Final QA must include a full contact sheet plus large targeted contact sheets
    for cognitive-risk beats such as mold/demold, oven, decoration, cut, and press;
    tiny sheets alone are not enough for continuity judgments.
  severity: high
  type: manual_or_local_qa_gate
