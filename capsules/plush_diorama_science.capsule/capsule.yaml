when_to_use:
- 讲一个看不见的过程：某样东西是怎么来的、怎么变的、为什么会这样（食物、材料、自然现象、身体里的过程）
- 过程能拆成 5–10 个因果步骤，并且发生在一个可以剖开的容器或地点里
- 想要可爱、安全、零崩坏的 3D 毛绒手办画风，口播 + 字幕的竖屏科普
- 用户给了一条参考口播，要按这个画风重做一期
when_not_to_use:
- 新闻、时效信息，或需要真实影像当证据的内容
- 人物访谈、观点争论、产品测评、真人出镜
- 需要照片级真实感，或扁平矢量 / 手绘画风
- 没有因果链的并列清单（十个冷知识之类）
- 不能本地运行 Blender、ffmpeg 和 whisper 的环境
