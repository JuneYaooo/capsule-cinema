rules:
- {id: final_video_required, type: artifact_required, severity: blocker, category: final_video, rule: Final video and cover must be produced before release.}
- {id: dedicated_procedural_route_required, type: route_gate, severity: blocker, category: route, rule: 'Final frames come from the capsule kit''s procedural Blender render; image-to-video, text-to-video, stock footage and generic generation may only be used for storyboard previews.'}
- {id: copy_confirmed_before_tts, type: workflow_gate, severity: blocker, category: copy, rule: 'The full copy set (script with readings and on-screen text, subtitle chunks, highlight words, title band, chapter pills, labels, shot table, publish copy) must be confirmed by the user before any TTS or rendering.'}
- {id: fact_check_required, type: copy_gate, severity: blocker, category: copy, rule: Every factual claim taken from a reference script is verified; corrections are listed for the user as original line, fix and source.}
- {id: opening_scene_and_payoff_named, type: copy_gate, severity: blocker, category: copy, rule: 'The first 6 seconds put the viewer in a concrete scene, show the protagonist, and name the payoff object; greetings, definitions and background setup are rejected.'}
- {id: causal_chain_spine, type: copy_gate, severity: blocker, category: copy, rule: 'The script follows hook, the 原来 reveal, numbered causal steps, one analogy, a standalone reveal sentence and a closing caveat; each sentence answers the previous one.'}
- {id: script_budget, type: copy_gate, severity: high, category: copy, rule: 'Narration budget is about 5.3 characters per second (about 400 characters for 80 seconds); overlong scripts are cut, never sped up.'}
- {id: chunk_and_highlight_shape, type: copy_gate, severity: high, category: copy, rule: 'Subtitle chunks are 3-15 characters, one meaning unit each; each sentence has 1-5 highlight words that are also the anchors of on-screen actions.'}
- {id: reading_and_display_split, type: copy_gate, severity: high, category: copy, rule: 'Numbers, percentages, formulas and easily misread words are written as Chinese readings for TTS and as compact text on screen; labels and pills avoid subscript and arrow symbols.'}
- {id: one_sentence_title_cover, type: copy_gate, severity: blocker, category: copy, rule: The title band, cover text and publish title are the same sentence (payoff keyword plus question).}
- {id: no_platform_names_in_narration, type: copy_gate, severity: high, category: copy, rule: Narration never names a specific platform.}
- {id: three_worlds_alternation, type: storyboard_gate, severity: high, category: structure, rule: 'Shots alternate between the character diorama, the cutaway container and the toy-lab table; the same world runs at most 3 shots in a row during the causal steps, and the character world returns at least every 30 seconds.'}
- {id: hero_container_continuity, type: storyboard_gate, severity: blocker, category: structure, rule: 'The hero container appears whole before it is cut open; its fill, liquid level and colour carry over between cutaway shots and never jump back.'}
- {id: chunk_boundary_cuts, type: edit_plan_gate, severity: blocker, category: edit, rule: 'Cuts happen only at subtitle chunk starts, 0.08 seconds before the voice; shots last 1-4.5 seconds with an average near 2.6 seconds.'}
- {id: reveal_beat, type: edit_plan_gate, severity: high, category: edit, rule: 'The reveal sentence is its own shot with 0.25 seconds of extra silence before and 0.45 seconds after.'}
- {id: keyword_anchored_motion, type: motion_gate, severity: blocker, category: motion, rule: 'Every key action and its sound effect are timed from the shot''s keyword events, not hard-coded seconds.'}
- {id: plush_aesthetic_lock, type: manual_review_gate, severity: blocker, category: visual, rule: 'Plush or matte materials only, cream ledge and grey-green wall, three soft area lights, low saturation with one warm focus; the protagonist keeps the same fur colour and accessory through the whole film.'}
- {id: safe_zone_clear, type: manual_review_gate, severity: blocker, category: visual, rule: 'Subjects and labels stay between y 400 and 1290 px; the title band (200-370) and subtitle band (1320-1490) stay clear, fixed with camera shift_y rather than tilt.'}
- {id: contact_sheet_review, type: manual_review_gate, severity: high, category: visual, rule: 'Review an 8-frame-per-shot contact sheet and step through fast shots frame by frame for interpenetration, flicker and scale errors.'}
- {id: tts_take_selection, type: audio_gate, severity: blocker, category: audio, rule: 'Each sentence gets 3 MiniMax takes at speed 1.0; the take is picked by toneless pinyin error rate and forced-decode score from both large-v3-turbo and medium.'}
- {id: dual_model_asr_release_check, type: audio_gate, severity: blocker, category: audio, rule: 'The final film is transcribed with both whisper models and compared with the script sentence by sentence; differing sentences are listened to, and a word misread in 3 takes is rewritten.'}
- {id: bgm_whole_bar_fit, type: audio_gate, severity: high, category: audio, rule: 'BGM is instrumental and is shortened only by removing whole bars at the most similar seam with a 40 ms equal-power crossfade, so its natural ending lands at the film end; the seam is checked by ear.'}
- {id: voice_ducking, type: audio_gate, severity: high, category: audio, rule: 'BGM sits at -8 dB without voice and -15.5 dB under voice, with a 0.12 s attack, 0.45 s release and no release in gaps shorter than 0.7 s.'}
- {id: procedural_sfx_in_key, type: audio_gate, severity: high, category: audio, rule: 'Sound effects are synthesized locally; pitched effects use the pentatonic scale of the BGM key and levels stay between -14 and -36 dB.'}
- {id: master_loudness, type: audio_gate, severity: blocker, category: audio, rule: 'Master is -14 LUFS within 0.2 LU with true peak no higher than -1 dBTP; voice is copied to both channels rather than downmixed.'}
- {id: overlay_system, type: text_overlay_gate, severity: high, category: text_overlay, rule: 'Title band, chapter pills, keyword-hop subtitles, tracked labels and one reveal sticker use the bundled ZCOOL fonts and the motion values in the motion recipe.'}
- {id: encode_and_probe, type: executable_release_gate, severity: blocker, category: delivery, rule: 'Encode as bt709 limited-range yuv420p with colour tags written into the bitstream; probe SAR 1:1, frame count equal to the timeline, and audio offset under half a frame.'}
- {id: zero_width_check, type: text_overlay_gate, severity: high, category: delivery, rule: Viewer-visible text is checked by code point for zero-width characters before delivery.}
