fields:
  actionable_takeaway:
    required: false
    type: string
  attention_trigger:
    required: false
    type: string
  audience_care_reason:
    required: false
    type: string
  audience_recall_sentence:
    required: false
    type: string
  audience_stop_reason:
    required: false
    type: string
  background_music_path:
    description: Alias for bgm_path.
    required: false
    type: string
  bgm_asset_filename:
    default: manten_diloty_bgm_cut_37sec.mp3
    description: Packaged default BGM asset filename.
    required: false
    type: string
  bgm_path:
    description: Local licensed audio file path for the requested BGM.
    required: false
    type: string
  bgm_title:
    default: Manten Diloty
    description: Requested BGM label/title.
    required: false
    type: string
  comment_trigger:
    description: Optional preferred debate/question for platform copy or final page.
    required: false
    type: string
  core_user_value:
    required: false
    type: string
  current_alternative:
    required: false
    type: string
  differentiators:
    required: false
    type: array
  facts_to_avoid:
    description: Optional list of claims or angles to avoid.
    required: false
    type: array
  facts_to_highlight:
    description: Optional list of source facts the user wants emphasized.
    required: false
    type: array
  ip_metaphor:
    required: false
    type: string
  memory_anchor:
    required: false
    type: string
  non_replaceable_hook:
    required: false
    type: string
  not_target_users:
    required: false
    type: array
  primary_audience:
    required: false
    type: array
  production_mode:
    default: short_silent_repo_showcase
    description: 'Only short_silent_repo_showcase is exposed: no voiceover, 4-5 pages,
      <=10 seconds.'
    required: false
    type: string
  project_boundaries:
    required: false
    type: array
  proof_asset_paths:
    required: false
    type: array
  repo_local_path:
    required: false
    type: string
  repo_slug:
    required: true
    type: string
  retention_goal:
    description: Optional user-provided retention goal or audience pressure to prioritize.
    required: false
    type: string
  scene_count:
    default: 5
    maximum: 5
    minimum: 4
    required: false
    type: integer
  scene_duration_seconds:
    default: 2
    required: false
    type: number
  share_save_reason:
    description: Optional reason the viewer should save, share, or forward the video.
    required: false
    type: string
  source_asset_manifest:
    description: Generated per-middle-visual provenance list from the agent's source
      material audit. Each item must identify an actual source asset and whether
      it is reconstructed/generated.
    required: false
    type: array
  source_asset_manifest_path:
    description: Local JSON manifest path when source_asset_manifest is stored outside
      the profile.
    required: false
    type: string
  target_audience:
    required: false
    type: string
  target_duration:
    default: 10
    maximum: 10
    required: false
    type: integer
  target_platform:
    default: wechat_channels
    required: false
    type: string
  trust_click_proof:
    required: false
    type: string
  unique_mechanism:
    required: false
    type: string
  use_reason:
    required: false
    type: string
  user_language:
    required: false
    type: string
  user_pain:
    required: false
    type: string
  user_prompt_emphasis:
    description: Optional user-provided audience or propagation phrase. Treat it as
      an internal targeting signal; public copy should translate it into concrete
      utility, install/use steps, and safe boundaries instead of echoing audience-bait
      phrasing.
    required: false
    type: string
  viewer_takeaway:
    required: false
    type: string
  wrong_audience:
    required: false
    type: array
