roles: {}
output_contract:
  bgm: external
  clip_audio: none
  on_frame_text: renderer_structured_cards
  subtitle: none
  voice: none
video_elements:
  fixed:
    aspect_ratio: '3:4'
    middle_visuals: actual_source_manifest_only
    visible_bottom_title: false
  defaults:
    target_duration: 10
    target_duration_max: 10
    bgm_volume: 0.85
    subtitle_max_chars: 14
  user_overridable: {}
  forbidden:
  - visible_bottom_title
  - reconstructed_source_cards
  - self_made_summary_cards_as_real_sources
source_material_contract:
  approved_middle_visual_source: actual_source_manifest_only
  allowed_source_asset_types:
  - repository_image
  - readme_embedded_image
  - documentation_screenshot
  - source_file_screenshot
  - demo_output_screenshot
  - video_or_gif_frame
  source_priority:
  - repository_owned_rich_visual
  - readme_or_docs_embedded_image
  - demo_or_output_screenshot
  - video_or_gif_frame
  - readme_content_screenshot
  - docs_content_screenshot
  - source_example_config_file_screenshot
  fallback_policy:
    on_no_rich_media: capture_real_readme_docs_or_source_file
    on_no_real_source: fail_approved_render
    preview_only_marker: fallback_generated_card
