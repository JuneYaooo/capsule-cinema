  current_run_input_may_reuse_literal: true
  project_identity_must_be_supplied_per_episode: true
  project_claims_and_assets_must_be_episode_scoped: true
  h3_outputs_must_be_episode_scoped: true
  h3_generation_must_run_per_episode: true
  no_real_project_name_or_output_format_in_reusable_recipes: true
