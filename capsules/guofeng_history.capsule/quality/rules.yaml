rules:
- id: style_strong_shuimo
  rule: Every scene must clearly show xuan paper, wet ink bloom, dry-brush edges,
    layered black-gray ink, and restrained mineral accents.
  severity: error
  type: manual_qc_required
- id: style_non_photoreal_guoman
  rule: Reject live-action historical drama, realistic costume-drama lighting, glossy
    3D, or weak generic guofeng concept art.
  severity: error
  type: manual_qc_required
- id: reference_identity_only
  rule: Reference images may guide face identity or style only; they must not copy
    pose, age, costume, camera angle, or lighting.
  severity: error
  type: manual_qc_required
- id: shot_variation
  rule: Scenes must vary age, costume, expression, pose, and camera angle; repeated
    same-angle portrait shots fail the capsule.
  severity: error
  type: manual_qc_required
- id: motion_no_handoff
  rule: Avoid hand-to-hand actions and violent handheld prop motion; use scroll reveal,
    ink-stroke formation, and parallax instead.
  severity: error
  type: manual_qc_required
- id: history_story_structure
  rule: Narration must include context, costly choice or conflict, turning point,
    human detail, and value judgment or viewer question.
  severity: error
  type: content_required
- expected_aspect_ratio: '9:16'
  id: duration_under_60_seconds
  max_duration_seconds: 60
  require_audio: true
  rule: Final video must stay at or below 60 seconds after measuring media duration,
    with no frozen or silent tail.
  severity: error
  type: video_quality
- category: subtitle
  id: short_safe_subtitles
  rule: Subtitles should be short transparent ink-wash gold cards, about 6 Chinese
    characters per line, within mobile safe bounds.
  severity: warning
  type: artifact_recommended
- id: continuous_voiceover_no_padding
  require_audio: true
  rule: Final narration must be one continuous full-track voiceover with no per-scene
    audio padding. Cut visuals to narration; do not slow the voice or insert silence
    to fill scenes.
  severity: error
  type: audio_timing
- id: distinct_first_frame_per_scene
  rule: Each narrative story beat must use one distinct generated first frame or source
    clip with different subject, angle, and composition. Do not split one source image
    or source clip into multiple story beats.
  severity: error
  type: manual_qc_required
- category: review_artifact
  id: segment_first_frame_contact_sheet_required
  rule: 'QA must include segment_first_frames_contact_sheet.jpg or equivalent: exactly
    one representative first frame per final visual segment, reviewed for repeated
    first frames.'
  severity: error
  type: artifact_required
- category: review_artifact
  id: first_image_contact_sheet_required
  rule: QA should include first_images_contact_sheet.jpg showing all generated first
    frames before video assembly.
  severity: warning
  type: artifact_required
- id: no_reused_source_clip_for_distinct_beats
  rule: Distinct story beats must not reuse the same source video or the same source
    image merely with different crops, subtitles, or Ken Burns motion.
  severity: error
  type: manual_qc_required
- id: real_motion_video_segments_required
  min_real_motion_segment_ratio: 0.85
  rule: Final delivery must use real image-to-video or generated video segments for
    the story beats. Static zoompan fallback is preview-only and must not be marked
    pass as the final release.
  severity: error
  type: manual_qc_required
- id: static_zoompan_preview_only
  rule: Assemblies built only from still images with ffmpeg zoompan, crop, pan, or
    Ken Burns motion are preview artifacts. They can be used for timing review but
    cannot satisfy final delivery QA.
  severity: error
  type: route_guard
- id: semantic_visual_timeline_required
  rule: Release videos must include a narration beat map and derive scene start/end
    times from narration meaning units. Equal-duration visual splitting is preview-only
    and cannot pass release QA.
  severity: error
  type: timeline_quality
- category: reference_design
  id: character_bible_required
  rule: Before storyboard image generation, provide a character bible defining every
    recurring character declared by the current story, plus recurring props and locations.
  severity: error
  type: artifact_required
- category: reference_design
  id: character_reference_sheet_required
  rule: A canonical character reference sheet or equivalent role-anchor artifact is
    required before generating scene images for recurring characters.
  severity: error
  type: artifact_required
- id: character_consistency_required
  rule: Recurring characters must remain consistent with the character bible/reference
    sheet across scenes; independently redesigning any current-story recurring character
    is a release blocker.
  severity: error
  type: manual_qc_required
- id: reference_identity_not_pose_lock
  rule: Character reference images must lock identity and style only; they must not
    force exact pose, action, camera angle, layout, location, or full front-facing
    appearance in every storyboard frame.
  severity: error
  type: manual_qc_required
- id: scene_appropriate_character_variation_required
  rule: Storyboard images should adapt recurring characters to the scene. Side, back,
    three-quarter, distant, silhouette, reflection, and partial-body views are allowed
    when story-appropriate, while preserving role identity markers.
  severity: error
  type: manual_qc_required
