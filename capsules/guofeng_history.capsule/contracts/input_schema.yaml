fields:
  storyboard_path:
    description: Absolute workspace-local path to the locked production storyboard JSON. It must contain exactly 10 scenes with image/video prompts, narration, and integer 4-15 second durations totaling 55 seconds. The same params JSON must be used for plan and run.
    required: true
    type: string
  narration_text:
    description: Unified final Chinese narration sent exactly once to MiniMax Chinese (Mandarin)_Radio_Host at the pinned 0.88 speed. It must match the locked storyboard narration and measure 45-55 seconds at those pinned voice settings.
    required: true
    type: string
  angle:
    default: 清廉、义理、人物选择或价值反转
    required: false
    type: string
  reference_image:
    description: Optional local reference image path for identity or style only.
    required: false
    type: string
  target_duration:
    default: 55
    maximum: 60
    required: false
    type: number
  topic_or_script:
    description: Historical figure topic, story angle, or full narration script.
    required: true
    type: string
