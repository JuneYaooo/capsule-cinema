schema_version: capsule.content_scope.v1
series_fixed:
  - shuimo_visual_style
  - historical_story_structure
  - character_consistency_method
  - tts_subtitle_route
episode_variable:
  - topic_or_script
  - historical_characters
  - character_relationships
  - story_facts
  - narration
forbidden_reusable_literals:
